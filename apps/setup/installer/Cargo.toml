[package]
name = "luft-installer"
version = "0.1.0"
description = "Installs Luft from the live system and finishes first-run setup"
authors = ["Kristof"]
license = "MIT"
edition = "2024"
rust-version = "1.98"

[dependencies]
access = { path = "../../../security/crates/access" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.189"
luft-dbus = { path = "../../../packages/dbus" }
luft-disks = { path = "../../../packages/disks" }
luft-windows = { path = "../../../packages/windows" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", default-features = false, features = ["rt", "macros", "time", "sync"] }
toml = "1.1.8"
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }

[dev-dependencies]
luft-windows = { path = "../../../packages/windows", features = ["testing"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true
