[package]
name = "disks"
version = "0.1.0"
description = "Drives, partitions and disk health for Luft"
authors = ["Kristof"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
name = "disks_lib"

[dependencies]
gio = "0.22.10"
libc = "0.2.189"
luft-app = { path = "../../../packages/app", features = ["recovery"] }
parking_lot = "0.12.5"
rayon = "1.12.0"
sabine = { git = "https://github.com/Lantharos/Sabine", tag = "v0.35" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
zbus = { version = "5.19.0", default-features = false, features = ["blocking-api", "tokio"] }
