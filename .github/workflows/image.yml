name: Image

on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      rebuild:
        description: Build every part again instead of reusing the unchanged ones
        type: boolean
        default: false
      promote:
        description: Release this tested nightly as the stable version, such as 1.20261020.57
        type: string
        default: ""

concurrency:
  group: image-${{ (github.ref_type == 'tag' || inputs.promote) && 'promote' || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && !inputs.promote }}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/lantharos/luft
  CACHE: ghcr.io/lantharos/luft-cache
  LUFT_PARTS: ghcr.io/lantharos/luft-parts
  FEDORA: "45"
  MAJOR: "1"
  DOWNLOADS: https://get.luft.computer
  RETIRED_NIGHTLY: 45-nightly

jobs:
  promote:
    name: Promote
    if: github.ref_type == 'tag' || inputs.promote
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.release.outputs.version }}
      revision: ${{ steps.release.outputs.revision }}
      notes: ${{ steps.release.outputs.notes }}
      digest: ${{ steps.release.outputs.digest }}
      nvidia-digest: ${{ steps.release.outputs.nvidia-digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/actions
            .github/scripts
            os/image/files

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: ./.github/actions/registry

      - name: Release the tested nightly
        id: release
        env:
          PROMOTED: ${{ inputs.promote || github.ref_name }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          version="${PROMOTED#v}"
          [[ "$version" =~ ^$MAJOR\.[0-9]{8}\.[0-9]+$ ]] || { echo "$PROMOTED doesn't name a Luft $MAJOR nightly." >&2; exit 1; }
          revision="$(skopeo inspect --retry-times 3 --format '{{index .Labels "org.opencontainers.image.revision"}}' "docker://$IMAGE:$version")"
          [[ -n "$revision" ]] || { echo "$version doesn't say which commit it was built from." >&2; exit 1; }
          previous="$(skopeo inspect --retry-times 3 --format '{{index .Labels "org.opencontainers.image.version"}}' "docker://$IMAGE:$MAJOR" || true)"
          nightly="$version"
          while [[ -n "$nightly" && "$(printf '%s\n' "$previous" "$nightly" | sort -V | tail -n 1)" != "$previous" ]]; do
            entry="$(curl -sf "$DOWNLOADS/nightly/notes/$nightly.json")" || break
            jq -c .notes <<<"$entry"
            nightly="$(jq -r '.previous // empty' <<<"$entry")"
          done > "$RUNNER_TEMP/nightlies.jsonl"
          notes="$(bun .github/scripts/changelog/index.ts merge < "$RUNNER_TEMP/nightlies.jsonl")"
          sudo install -Dm644 -t /usr/share/pki/containers os/image/files/usr/share/pki/containers/luft.pub
          install -Dm644 -t ~/.config/containers/registries.d os/image/files/etc/containers/registries.d/luft.yaml
          for suffix in "" -nvidia; do
            digest="$(skopeo inspect --retry-times 3 --format '{{.Digest}}' "docker://$IMAGE:$version$suffix")"
            skopeo copy --retry-times 3 --preserve-digests --policy os/image/files/etc/containers/policy.json \
              "docker://$IMAGE@$digest" "docker://$IMAGE:$MAJOR$suffix"
            echo "${suffix#-}${suffix:+-}digest=$digest" >> "$GITHUB_OUTPUT"
          done
          jq -n --arg version "$version" --arg previous "$previous" --argjson notes "$notes" \
            '{version: $version, previous: (if $previous == "" then null else $previous end), notes: $notes}' |
            aws s3 cp - "s3://$R2_BUCKET/$MAJOR/notes/$version.json" --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
              --content-type application/json --only-show-errors
          {
            echo "version=$version"
            echo "revision=$revision"
            echo "notes=$notes"
          } >> "$GITHUB_OUTPUT"

  stick:
    name: Stick
    needs: promote
    uses: ./.github/workflows/iso.yml
    with:
      channel: release
    secrets: inherit
    permissions:
      contents: read
      packages: read

  release:
    name: GitHub release
    needs: [promote, stick]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.promote.outputs.version }}
      REVISION: ${{ needs.promote.outputs.revision }}
      NOTES: ${{ needs.promote.outputs.notes }}
      DIGEST: ${{ needs.promote.outputs.digest }}
      NVIDIA_DIGEST: ${{ needs.promote.outputs.nvidia-digest }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Publish the release
        run: |
          bun .github/scripts/changelog/index.ts markdown <<<"$NOTES" > "$RUNNER_TEMP/CHANGES.md"
          cd "$RUNNER_TEMP"
          iso="luft-$VERSION.iso"
          for file in "$iso.sha256" "$iso.sha256.minisig"; do
            curl -sfLO "$DOWNLOADS/$MAJOR/$file"
          done
          key="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$REVISION/os/image/files/usr/share/pki/containers/luft.pub"
          cat CHANGES.md - > body.md <<EOF

          ## Downloads

          - [$iso]($DOWNLOADS/$MAJOR/$iso), with its [checksum]($DOWNLOADS/$MAJOR/$iso.sha256) and [signature]($DOWNLOADS/$MAJOR/$iso.sha256.minisig)
          - Meet Luft for [Windows]($DOWNLOADS/meet/meet-luft.exe) ([checksum]($DOWNLOADS/meet/meet-luft.exe.sha256)) and [Linux]($DOWNLOADS/meet/meet-luft.AppImage) ([checksum]($DOWNLOADS/meet/meet-luft.AppImage.sha256))

          ## Images

          | Image | Digest |
          | --- | --- |
          | \`$IMAGE:$MAJOR\` | \`$DIGEST\` |
          | \`$IMAGE:$MAJOR-nvidia\` | \`$NVIDIA_DIGEST\` |

          Both are signed with [Luft's key]($key):

          \`\`\`
          cosign verify --key luft.pub --insecure-ignore-tlog=true $IMAGE@$DIGEST
          \`\`\`
          EOF
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$REVISION" --title "Luft $VERSION" \
            --notes-file body.md CHANGES.md "$iso.sha256" "$iso.sha256.minisig"

  plan:
    if: github.ref_type != 'tag' && !inputs.promote
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    outputs:
      skip: ${{ steps.version.outputs.skip }}
      version: ${{ steps.version.outputs.version }}
      tags: ${{ steps.version.outputs.tags }}
      notes: ${{ steps.version.outputs.notes }}
      base: ${{ steps.parts.outputs.base }}
      parts: ${{ steps.parts.outputs.parts }}
      signed: ${{ steps.parts.outputs.signed }}
      details: ${{ steps.parts.outputs.details }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: ./.github/actions/registry

      - name: Version and release notes
        id: version
        run: |
          nightly="$(skopeo inspect --retry-times 3 --format '{{json .Labels}}' "docker://$IMAGE:$MAJOR-nightly")"
          built="$(jq -r '."org.opencontainers.image.revision" // empty' <<<"$nightly")"
          base="$(os/image/build.sh base)"
          echo "LUFT_BASE=$base" >> "$GITHUB_ENV"
          if [[ "$GITHUB_EVENT_NAME" == schedule && "$built" == "$GITHUB_SHA" &&
                "$base" == "$(jq -r '."org.opencontainers.image.base.name" // empty' <<<"$nightly")" ]] &&
            LUFT_BASE="$base" os/image/build.sh updates "$IMAGE:$MAJOR-nightly"; then
            echo "Nothing changed since the last nightly."
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="$MAJOR.$(date -u +%Y%m%d).${{ github.run_number }}"
          tags=("$MAJOR-nightly" "$version" "$RETIRED_NIGHTLY")
          {
            echo "version=$version"
            echo "tags=${tags[*]}"
            echo "notes=$(bun .github/scripts/changelog/index.ts since "$built")"
          } >> "$GITHUB_OUTPUT"

      - name: Parts
        id: parts
        if: steps.version.outputs.skip != '1'
        env:
          LUFT_SECUREBOOT_CERT: os/image/keys/luft-secureboot.crt
          LUFT_REBUILD: ${{ inputs.rebuild && '1' || '' }}
        run: |
          os/image/build.sh plan luft-nvidia | tee "$RUNNER_TEMP/parts.tsv"
          rows() {
            jq --raw-input --slurp --compact-output '[
              split("\n")[] | select(length > 0) | split("\t") | select(.[2] == "missing") |
              {name: .[0], key: (.[1] | sub(".*-"; "")), family: (.[0] | sub("-.*"; "")), signing: .[3]}
            ]' "$RUNNER_TEMP/parts.tsv"
          }
          missing="$(rows)"
          {
            echo "base=$LUFT_BASE"
            echo "parts=$(jq -c '[.[] | select(.signing == "unsigned") | .name]' <<<"$missing")"
            echo "signed=$(jq -c '[.[] | select(.signing == "signed") | .name]' <<<"$missing")"
            echo "details=$(jq -c 'map({(.name): {key, family}}) | add // {}' <<<"$missing")"
          } >> "$GITHUB_OUTPUT"

  parts:
    name: Part
    needs: plan
    if: needs.plan.outputs.skip != '1' && needs.plan.outputs.parts != '[]'
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.plan.outputs.parts) }}
    env:
      LUFT_BASE: ${{ needs.plan.outputs.base }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/build-part
        with:
          part: ${{ matrix.part }}
          key: ${{ fromJSON(needs.plan.outputs.details)[matrix.part].key }}
          family: ${{ fromJSON(needs.plan.outputs.details)[matrix.part].family }}

  signed-parts:
    name: Signed part
    needs: plan
    if: needs.plan.outputs.skip != '1' && needs.plan.outputs.signed != '[]'
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.plan.outputs.signed) }}
    env:
      LUFT_BASE: ${{ needs.plan.outputs.base }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/signing-keys
        with:
          key: ${{ secrets.LUFT_SECUREBOOT_KEY }}
          certificate: ${{ secrets.LUFT_SECUREBOOT_CERT }}

      - uses: ./.github/actions/build-part
        with:
          part: ${{ matrix.part }}
          key: ${{ fromJSON(needs.plan.outputs.details)[matrix.part].key }}
          family: ${{ fromJSON(needs.plan.outputs.details)[matrix.part].family }}

      - name: Forget the signing keys
        if: always()
        run: rm -rf "$LUFT_KEYS"

  image:
    name: Images
    needs: [plan, parts, signed-parts]
    if: >-
      always() && needs.plan.result == 'success' && needs.plan.outputs.skip != '1' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    env:
      LUFT_BASE: ${{ needs.plan.outputs.base }}
      VERSION: ${{ needs.plan.outputs.version }}
      RELEASE_NOTES: ${{ needs.plan.outputs.notes }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/make-room

      - uses: ./.github/actions/registry

      - name: Build folders
        run: |
          {
            echo "LUFT_IMAGE_STATE=$RUNNER_TEMP/image"
            echo "TMPDIR=$RUNNER_TEMP"
          } >> "$GITHUB_ENV"

      - uses: ./.github/actions/signing-keys
        with:
          key: ${{ secrets.LUFT_SECUREBOOT_KEY }}
          certificate: ${{ secrets.LUFT_SECUREBOOT_CERT }}
          pcr-key: ${{ secrets.LUFT_PCR_KEY }}

      - name: Build both images
        run: |
          os/image/build.sh luft luft-nvidia --cache-from "$CACHE" --cache-to "$CACHE" \
            --build-arg "VERSION=$VERSION" --build-arg "REVISION=$GITHUB_SHA" --build-arg "RELEASE_NOTES=$RELEASE_NOTES"

      - name: Forget the signing keys
        if: always()
        run: rm -rf "$LUFT_KEYS"

      - name: Push and sign
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          key="$(mktemp -d)"
          trap 'rm -rf "$key"' EXIT
          printf '%s\n' "$COSIGN_PRIVATE_KEY" > "$key/private"
          printf '%s' "$COSIGN_PASSWORD" > "$key/password"
          install -Dm644 -t ~/.config/containers/registries.d os/image/files/etc/containers/registries.d/luft.yaml
          for suffix in "" -nvidia; do
            podman push --sign-by-sigstore-private-key "$key/private" --sign-passphrase-file "$key/password" \
              "localhost/luft:$FEDORA$suffix" "$IMAGE:$VERSION$suffix"
          done

  publish:
    needs: [plan, image]
    if: always() && needs.image.result == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAGS: ${{ needs.plan.outputs.tags }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions

      - uses: ./.github/actions/registry

      - name: Publish the release notes
        env:
          NOTES: ${{ needs.plan.outputs.notes }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          previous="$(skopeo inspect --retry-times 3 --format '{{index .Labels "org.opencontainers.image.version"}}' "docker://$IMAGE:$MAJOR-nightly")"
          jq -n --arg version "$VERSION" --arg previous "$previous" --argjson notes "$NOTES" \
            '{version: $version, previous: $previous, notes: $notes}' |
            aws s3 cp - "s3://$R2_BUCKET/nightly/notes/$VERSION.json" --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
              --content-type application/json --only-show-errors

      - name: Tag both images
        run: |
          for tag in $TAGS; do
            [[ "$tag" != "$VERSION" ]] || continue
            for suffix in "" -nvidia; do
              skopeo copy --retry-times 3 --preserve-digests "docker://$IMAGE:$VERSION$suffix" "docker://$IMAGE:$tag$suffix"
            done
          done
