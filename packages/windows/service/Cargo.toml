[package]
name = "luft-windows-service"
version = "0.1.0"
description = "Looks after Windows on the same computer: Fast Startup, its clock and its Bluetooth devices"
authors = ["Kristof"]
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "luft-windows"
path = "src/main.rs"

[dependencies]
access.workspace = true
anyhow.workspace = true
futures-util.workspace = true
libc.workspace = true
luft-windows.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
zbus = { workspace = true, features = ["tokio"] }

[lints]
workspace = true
