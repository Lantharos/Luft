<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <description>Draw emoji with Twemoji</description>
  <alias binding="same">
    <family>Twemoji</family>
    <default><family>emoji</family></default>
  </alias>
  <alias binding="same">
    <family>emoji</family>
    <prefer>
      <family>Twemoji</family>
    </prefer>
  </alias>
</fontconfig>
