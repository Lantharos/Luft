[app]
id = "com.lantharos.meet"
name = "Meet Luft"
generic_name = "Luft installer for Windows"
categories = ["System"]
keywords = ["luft", "install", "dual boot", "linux"]
version = "0.1.1"
icon = "public/favicon.svg"
installer_image = "desktop/installer.png"
cargo_manifest = "desktop/Cargo.toml"

[web]
root = "."
dist = "dist"
entry = "dist/index.html"
build = "bun run build"
local_files = true

[updates]
provider = "github"
repository = "Lantharos/Luft"
policy = "disabled"

[bindings]
path = "src/lib/bindings.ts"
