name: Meet Luft

on:
  workflow_dispatch:

concurrency:
  group: meet-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SABINE: v0.64

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: rustup toolchain install stable --profile minimal

      - name: Install NSIS
        run: |
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          "${env:ProgramFiles(x86)}\NSIS" >> $env:GITHUB_PATH

      - run: cargo install --git https://github.com/Lantharos/Sabine --tag $env:SABINE --locked sabine-cli

      - name: Find signtool
        if: vars.WINDOWS_CERTIFICATE_SHA1 != ''
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool is missing' }
          $signtool.DirectoryName >> $env:GITHUB_PATH
          $thumbprint = '${{ vars.WINDOWS_CERTIFICATE_SHA1 }}'
          if (-not (Get-ChildItem Cert:\CurrentUser\My, Cert:\LocalMachine\My | Where-Object Thumbprint -eq $thumbprint)) {
            throw "The code signing certificate $thumbprint isn't in the certificate store"
          }
          "SABINE_WINDOWS_CERTIFICATE_SHA1=$thumbprint" >> $env:GITHUB_ENV

      - name: Bundle
        working-directory: apps/meet
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = sabine bundle . --target exe --release --out $env:RUNNER_TEMP/meet --json | Select-Object -Last 1
          if ($LASTEXITCODE -ne 0) { throw 'Bundling failed' }
          $artifacts = @(($bundle | ConvertFrom-Json).artifacts)
          if ($artifacts.Count -ne 1) { throw "Bundling made no setup program: $bundle" }
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item -LiteralPath $artifacts[0] -Destination out/meet-luft.exe
          $hash = (Get-FileHash out/meet-luft.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  meet-luft.exe" | Set-Content -NoNewline out/meet-luft.exe.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: meet-luft-windows
          path: apps/meet/out
          retention-days: 14

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: rustup toolchain install stable --profile minimal

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwayland-dev libfontconfig1-dev libxkbcommon-dev
          curl --fail --location --output "$RUNNER_TEMP/appimagetool" https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $RUNNER_TEMP/appimagetool" | sha256sum --check
          sudo install -m 755 "$RUNNER_TEMP/appimagetool" /usr/local/bin/appimagetool

      - run: cargo install --git https://github.com/Lantharos/Sabine --tag "$SABINE" --locked sabine-cli

      - name: Bundle
        working-directory: apps/meet
        run: |
          bundle="$(sabine bundle . --target appimage --release --out "$RUNNER_TEMP/meet" --json | tail -n 1)"
          mapfile -t artifacts < <(jq -r '.artifacts[]' <<<"$bundle")
          [[ ${#artifacts[@]} -eq 1 ]] || { echo "Bundling made no AppImage: $bundle"; exit 1; }
          mkdir -p out
          install -m 755 "${artifacts[0]}" out/meet-luft.AppImage
          (cd out && sha256sum meet-luft.AppImage > meet-luft.AppImage.sha256)

      - uses: actions/upload-artifact@v7
        with:
          name: meet-luft-linux
          path: apps/meet/out
          retention-days: 14

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: meet-luft-*
          merge-multiple: true
          path: out

      - name: Upload to R2
        if: env.R2_ACCOUNT_ID != '' && env.R2_BUCKET != ''
        working-directory: out
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          for file in meet-luft.exe meet-luft.exe.sha256 meet-luft.AppImage meet-luft.AppImage.sha256; do
            aws s3 cp --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" --no-progress "$file" "s3://$R2_BUCKET/meet/$file"
          done
