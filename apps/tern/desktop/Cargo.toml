[package]
name = "tern"
version = "0.1.0"
description = "A terminal for Luft"
authors = ["Kristof"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
name = "tern_lib"

[dependencies]
base64 = "0.23.1"
dirs = "7.0.0"
gio = "0.22.10"
luft-app = { path = "../../../packages/app" }
parking_lot = "0.12.5"
rustix = { version = "1.1.5", features = ["event", "fs", "pipe", "process", "pty", "stdio", "termios"] }
sabine = { git = "https://github.com/Lantharos/Sabine", tag = "v0.31" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uzers = "0.12.2"
zbus = { version = "5.19.0", default-features = false, features = ["blocking-api", "tokio"] }
