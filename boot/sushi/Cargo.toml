[workspace]
resolver = "2"
members = [
    "crates/sushi",
    "crates/sushid",
    "crates/sushictl",
    "crates/sushiboot",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Misoworks/Sushi"
rust-version = "1.75"

[workspace.dependencies]
sushi = { path = "crates/sushi" }

anyhow = "1"
bitflags = { version = "2", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
drm = "0.12"
libc = "0.2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.release.package.sushiboot]