[package]
name = "luft-accounts-service"
version = "0.1.0"
description = "Keeps online accounts in Luft Keyring and brings their files to ~/Cloud through rclone"
authors = ["Kristof"]
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "luft-accounts"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
futures-util.workspace = true
inotify = { workspace = true, features = ["default"] }
libc.workspace = true
luft-accounts.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
time = { workspace = true, features = ["formatting", "parsing"] }
tokio = { workspace = true, features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
ureq = { workspace = true, features = ["json"] }
url.workspace = true
zbus = { workspace = true, features = ["proxy", "service", "tokio"] }

[lints]
workspace = true
