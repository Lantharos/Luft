workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

default:
  tags: [luft]

build:
  resource_group: luft
  rules:
    - if: $PROMOTE != "1"
  script:
    - '"$LUFT_TOOLS/org/org.sh" mirror .'
    - '"$LUFT_TOOLS/org/org.sh" update .'

promote:
  resource_group: luft
  rules:
    - if: $PROMOTE == "1"
  script:
    - '"$LUFT_TOOLS/org/org.sh" promote .'
