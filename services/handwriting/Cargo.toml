[package]
name = "luft-handwriting-service"
version = "0.1.0"
description = "Handwriting for Luft: reads lines written with a pen as text, on this computer"
authors = ["Kristof"]
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "luft-handwriting"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
libc.workspace = true
luft-dbus.workspace = true
luft-dbus-macros.workspace = true
luft-handwriting.workspace = true
luft-models.workspace = true
llama-cpp-2 = { workspace = true, features = ["common", "mtmd", "vulkan"] }
serde.workspace = true
serde_json.workspace = true
tiny-skia = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
zbus = { workspace = true, features = ["service", "tokio"] }

[lints]
workspace = true
