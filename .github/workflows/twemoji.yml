name: Twemoji

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  follow:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Follow Twemoji's latest release
        env:
          GH_TOKEN: ${{ github.token }}
          FILE: os/image/parts/twemoji/release
        run: |
          tag="$(gh release view --repo jdecked/twemoji --json tagName --jq .tagName)"
          [[ "$tag" =~ ^v[0-9]+(\.[0-9]+)+$ ]] || { echo "Unexpected Twemoji release $tag" >&2; exit 1; }
          read -r current _ <"$FILE"
          [[ "${tag#v}" != "$current" ]] || exit 0
          sha256="$(curl -fsSL --retry 5 "https://github.com/jdecked/twemoji/archive/refs/tags/$tag.tar.gz" | sha256sum | cut -d' ' -f1)"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$FILE" \
            -f message="Update Twemoji to ${tag#v}" \
            -f content="$(echo "${tag#v} $sha256" | base64 -w0)" \
            -f sha="$(git rev-parse "HEAD:$FILE")" \
            -f branch="$GITHUB_REF_NAME"
