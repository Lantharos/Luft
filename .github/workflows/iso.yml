name: ISO

on:
  workflow_run:
    workflows: [Image]
    types: [completed]
  workflow_dispatch:
    inputs:
      image:
        description: Image to build the ISO from
        default: ghcr.io/lantharos/luft:1-nightly

concurrency:
  group: iso-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: ISO
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       ((github.event.workflow_run.event == 'push' && startsWith(github.event.workflow_run.head_branch, 'v')) ||
        github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    env:
      DOWNLOADS: https://get.luft.computer
      LUFT_ISO: ${{ github.workspace }}/iso
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      KEPT_NIGHTLIES: 3
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: ./.github/actions/make-room

      - uses: ./.github/actions/registry

      - name: Image and folder
        env:
          CHOSEN: ${{ inputs.image }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [[ -n "$CHOSEN" ]]; then
            image="$CHOSEN"
          elif [[ "$RUN_EVENT" == push ]]; then
            image="ghcr.io/lantharos/luft:${RUN_TAG#v}"
          else
            image=ghcr.io/lantharos/luft:1-nightly
          fi
          version="$(skopeo inspect --format '{{index .Labels "org.opencontainers.image.version"}}' "docker://$image")"
          if [[ "$version" == *-nightly ]]; then folder=nightly; else folder="${version%%.*}"; fi
          published="$(curl -sf "$DOWNLOADS/$folder/latest.json" | jq -r .version || true)"
          if [[ "$GITHUB_EVENT_NAME" == workflow_run && "$published" == "$version" ]]; then
            echo "luft-$version.iso is already published."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
          {
            echo "IMAGE=$image"
            echo "VERSION=$version"
            echo "FOLDER=$folder"
            echo "ISO_NAME=luft-$version.iso"
          } >> "$GITHUB_ENV"

      - name: Check the images' signatures
        if: env.SKIP != '1'
        run: |
          sudo install -Dm644 -t /usr/share/pki/containers os/image/files/usr/share/pki/containers/luft.pub
          install -Dm644 -t ~/.config/containers/registries.d os/image/files/etc/containers/registries.d/luft.yaml
          for reference in "$IMAGE" "$IMAGE-nvidia"; do
            podman pull --quiet --signature-policy os/image/files/etc/containers/policy.json "$reference" > /dev/null
          done

      - name: Build
        if: env.SKIP != '1'
        run: |
          mkdir -p "$LUFT_ISO"
          os/iso/build.sh "$IMAGE"
          ls -l "$LUFT_ISO"

      - name: Sign the checksum
        if: env.SKIP != '1'
        working-directory: ${{ env.LUFT_ISO }}
        env:
          LUFT_ISO_MINISIGN_KEY: ${{ secrets.LUFT_ISO_MINISIGN_KEY }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes minisign
          key="$RUNNER_TEMP/luft-iso.key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$LUFT_ISO_MINISIGN_KEY" > "$key"
          minisign -S -s "$key" -m "$ISO_NAME.sha256" -t "$ISO_NAME"

      - name: Describe the newest stick
        if: env.SKIP != '1'
        working-directory: ${{ env.LUFT_ISO }}
        run: |
          jq -n --arg name "$ISO_NAME" --arg version "$VERSION" --argjson size "$(stat -c %s "$ISO_NAME")" \
            --arg sha256 "$(cut -d' ' -f1 "$ISO_NAME.sha256")" '{name: $name, version: $version, size: $size, sha256: $sha256}' > latest.json
          cat latest.json

      - name: Upload to R2
        if: env.SKIP != '1'
        working-directory: ${{ env.LUFT_ISO }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          endpoint="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          s3() { aws s3 "$@" --endpoint-url "$endpoint" --no-progress --only-show-errors; }
          for file in "$ISO_NAME" "$ISO_NAME.sha256" "$ISO_NAME.sha256.minisig"; do
            s3 cp "$file" "s3://$R2_BUCKET/$FOLDER/$file"
          done
          s3 cp latest.json "s3://$R2_BUCKET/$FOLDER/latest.json" --cache-control max-age=300
          if [[ "$FOLDER" == nightly ]]; then
            aws s3 ls "s3://$R2_BUCKET/nightly/" --endpoint-url "$endpoint" | awk '{print $4}' | grep -E '^luft-.*-nightly\.iso$' | sort -t. -k2,2n -k3,3n | head -n -"$KEPT_NIGHTLIES" |
              while read -r old; do
                for file in "$old" "$old.sha256" "$old.sha256.minisig"; do
                  s3 rm "s3://$R2_BUCKET/nightly/$file"
                done
              done
          fi
