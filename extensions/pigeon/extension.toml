id = "com.lantharos.Pigeon"
name = "Pigeon"
description = "Sends files and text to phones and computers nearby, and takes what they send, with LocalSend's apps."
version = "1.0.0"
api = 1
permissions = ["quick-settings", "taskbar", "popups", "notifications", "clipboard", "file-actions"]

[helper]
path = "pigeon"

[network]
listen = [{ port = 53317, protocol = "tcp" }, { port = 53317, protocol = "udp" }]

[[settings]]
key = "receive"
type = "switch"
label = "receive"
default = true

[[settings]]
key = "copy-text"
type = "switch"
label = "copy-text"
default = true

[[settings]]
key = "copy-picture"
type = "switch"
label = "copy-picture"
default = false

[[settings]]
key = "taskbar"
type = "switch"
label = "taskbar"
default = true
page = "taskbar"
