[package]
name = "luft-shell"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
clap.workspace = true
sabine = { git = "https://github.com/Lantharos/Sabine.git", rev = "8239fb371534bb022c3a037d77f2a040fa6b0090" }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
serde.workspace = true
serde_json.workspace = true
luft-config.workspace = true
luft-ipc = { version = "0.1.0", path = "../luft-ipc" }
time = { version = "0.3.54", features = ["formatting", "local-offset", "macros"] }
tracing.workspace = true
tracing-subscriber.workspace = true
zbus = { version = "5.18.0", features = ["blocking-api"] }
