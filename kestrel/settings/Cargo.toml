[package]
name = "kestrel-settings"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
futures-util = { workspace = true, features = ["std"] }
gio.workspace = true
glib = { workspace = true, features = ["v2_68"] }
pulseaudio.workspace = true
rustix = { workspace = true, features = ["fs", "process"] }
serde.workspace = true
tokio = { workspace = true, features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "process",
  "rt",
  "signal",
  "sync",
  "time",
] }
tzf-rs = { workspace = true, features = ["bundled"] }
x11rb.workspace = true
zbus = { workspace = true, features = ["proxy", "service", "tokio"] }

[lints]
workspace = true
