[package]
name = "luft-keyring-vault"
description = "Luft Keyring's encrypted storage"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
argon2 = { workspace = true, features = ["default"] }
chacha20poly1305 = { workspace = true, features = ["alloc", "zeroize"] }
ciborium.workspace = true
getrandom.workspace = true
hkdf.workspace = true
luft-keyring-wire.workspace = true
rustix = { workspace = true, features = ["fs", "mm", "net", "pipe", "process"] }
serde.workspace = true
sha2.workspace = true
zeroize = { workspace = true, features = ["derive", "serde"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
