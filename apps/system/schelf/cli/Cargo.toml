[package]
name = "schelf-cli"
version = "0.4.0"
description = "The schelf command: installs apps and tools, and publishes them on schelf.store"
authors = ["Kristof"]
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
futures-util.workspace = true
libc.workspace = true
luft-dbus.workspace = true
luft-software = { workspace = true, features = ["system"] }
schelf-core.workspace = true
schelf-publish.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "signal", "sync"] }
zbus = { workspace = true, features = ["proxy", "tokio"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
