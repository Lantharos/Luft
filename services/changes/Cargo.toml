[package]
name = "luft-changes"
version = "0.1.0"
description = "Applies the system settings someone reviewed in Kestrel, for luft"
authors = ["Kristof"]
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
luft-dbus = { workspace = true, features = ["service"] }
luft-dbus-macros.workspace = true
luft-identity.workspace = true
luft-variant.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
zbus = { workspace = true, features = ["proxy", "service", "tokio"] }

[lints]
workspace = true
