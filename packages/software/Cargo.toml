[package]
name = "luft-software"
version = "0.1.0"
description = "Apps, system updates and offline updates shared by Luft's software tools"
authors = ["Kristof"]
license = "GPL-3.0-or-later"
edition = "2024"
rust-version = "1.98"

[features]
default = ["system"]
system = ["dep:futures-util", "dep:luft-app", "dep:zbus"]

[dependencies]
backhand = { version = "0.25.5", default-features = false, features = ["xz", "gzip", "zstd", "lz4"] }
dirs = "7.0.0"
futures-util = { version = "0.3.34", default-features = false, optional = true }
glob = "0.3.4"
libc = "0.2.190"
luft-app = { path = "../app", features = ["apps"], optional = true }
luft-variant = { path = "../variant" }
rustix = { version = "1.1.5", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
ureq = { version = "3.4.2", features = ["platform-verifier"] }
zbus = { version = "6.0.0", default-features = false, features = ["proxy", "tokio"], optional = true }
