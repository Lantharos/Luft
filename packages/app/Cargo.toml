[package]
name = "luft-app"
version = "0.1.0"
description = "Native bootstrap shared by Luft apps"
authors = ["Kristof"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[features]
apps = ["dep:dirs", "dep:gio", "dep:gio-unix"]
fonts = ["dep:dirs", "dep:gio"]
thumbnails = [
    "dep:dirs",
    "dep:fast_image_resize",
    "dep:gio",
    "dep:image",
    "dep:libc",
    "dep:md-5",
    "dep:parking_lot",
    "dep:png",
]

[dependencies]
dirs = { version = "7.0.0", optional = true }
fast_image_resize = { version = "6.1.0", optional = true }
gio = { version = "0.22.10", optional = true }
gio-unix = { version = "0.22.8", optional = true }
image = { version = "0.25.10", optional = true, default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff", "qoi", "tga", "pnm"] }
libc = { version = "0.2.189", optional = true }
md-5 = { version = "0.11.0", optional = true }
parking_lot = { version = "0.12.5", optional = true }
png = { version = "0.18.1", optional = true }
sabine = { git = "https://github.com/Lantharos/Sabine", tag = "v0.33" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", default-features = false, features = ["rt-multi-thread", "sync"] }
zbus = { version = "5.19.0", default-features = false, features = ["blocking-api", "tokio"] }
