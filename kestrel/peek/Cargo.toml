[package]
name = "peek"
description = "Sees and uses windows on Luft"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
clap = { workspace = true, features = ["wrap_help"] }
luft-dbus-macros.workspace = true
rustix = { workspace = true, features = ["event", "fs", "pipe", "process", "stdio"] }
serde_json.workspace = true
signal-hook.workspace = true
zbus = { workspace = true, features = ["default-rt", "proxy"] }

[lints]
workspace = true
