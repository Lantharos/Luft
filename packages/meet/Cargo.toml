[package]
name = "luft-meet"
version = "0.1.0"
description = "What Meet Luft leaves on the drive for Install Luft: its partitions, why it restarted and the moving box"
authors = ["Kristof"]
license = "MIT"
edition = "2024"
rust-version = "1.98"

[dependencies]
icu_locale_core = "2.3.0"
icu_time = { version = "2.3.0", default-features = false, features = ["compiled_data"] }
roxmltree = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
