[package]
name = "luft-keyring-unlock"
description = "Hands the keyring key to a person's own keyring after they sign in"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
getrandom.workspace = true
libc.workspace = true
luft-keyring-wire = { workspace = true, features = ["tokio"] }
postcard.workspace = true
serde.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt", "signal", "sync", "time"] }
tss-esapi.workspace = true
zeroize = { workspace = true, features = ["derive", "serde"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
