part = "app-schelf"

[files]
"/usr/share/applications/" = ["data/com.lantharos.schelf.parcel.desktop"]
"/usr/share/icons/hicolor/scalable/apps/" = ["data/com.lantharos.schelf.parcel.svg"]
"/usr/lib/systemd/user/" = [
    "data/luft-app-updates.service",
    "data/luft-app-updates.timer",
    "data/luft-app-revocations.service",
    "data/luft-app-revocations.timer",
    "data/luft-integrate-apps.service",
    "data/luft-preinstall.service",
    "data/luft-app-drives.service",
    "data/luft-app-graphics.service",
]

[enable]
user = ["luft-integrate-apps.service", "luft-preinstall.service", "luft-app-drives.service", "luft-app-graphics.service", "luft-app-updates.timer", "luft-app-revocations.timer"]
