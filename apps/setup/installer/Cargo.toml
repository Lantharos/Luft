[package]
name = "luft-installer"
version = "0.1.0"
description = "Installs Luft from the live system and finishes first-run setup"
authors = ["Kristof"]
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
futures-util.workspace = true
clap.workspace = true
libc.workspace = true
luft-dbus.workspace = true
luft-identity.workspace = true
luft-disks.workspace = true
luft-i18n.workspace = true
luft-meet.workspace = true
luft-trust.workspace = true
luft-windows.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
toml.workspace = true
toml_edit.workspace = true
zbus = { workspace = true, features = ["service", "tokio"] }

[dev-dependencies]
luft-windows = { workspace = true, features = ["testing"] }

[lints]
workspace = true
