[package]
name = "luft-sleep"
version = "0.1.0"
description = "Shuts a sleeping computer down before its battery runs flat"
authors = ["Kristof"]
license = "MIT"
edition = "2024"
rust-version = "1.98"

[dependencies]
access = { path = "../../../security/crates/access" }
anyhow = "1.0.104"
rustix = { version = "1.1.5", features = ["time"] }
tokio = { version = "1.53.3", default-features = false, features = ["rt", "macros", "time", "sync"] }
zbus = { version = "6.0.0", default-features = false, features = ["tokio"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true
