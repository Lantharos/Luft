[package]
name = "luft-software"
version = "0.1.0"
description = "Apps, system updates and offline updates shared by Luft's software tools"
authors = ["Kristof"]
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = ["system"]
system = ["dep:futures-util", "dep:luft-app", "dep:tokio", "dep:zbus"]

[dependencies]
backhand = { workspace = true, features = ["gzip", "lz4", "xz", "zstd"] }
dirs.workspace = true
futures-util = { workspace = true, optional = true }
glob.workspace = true
libc.workspace = true
luft-app = { workspace = true, features = ["apps"], optional = true }
luft-variant.workspace = true
rustix = { workspace = true, features = ["fs"] }
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["rt"], optional = true }
ureq.workspace = true
zbus = { workspace = true, features = ["proxy", "tokio"], optional = true }

[lints]
workspace = true
