[package]
name = "setup"
version = "0.1.0"
description = "Installs Luft and sets up a new computer"
authors = ["Kristof"]
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "setup_lib"

[dependencies]
futures-util.workspace = true
gio.workspace = true
gio-unix.workspace = true
luft-app = { workspace = true, features = ["launch", "recovery"] }
luft-fingerprint.workspace = true
libc.workspace = true
luft-i18n.workspace = true
luft-meet.workspace = true
luft-network.workspace = true
luft-trust.workspace = true
luft-variant.workspace = true
roxmltree.workspace = true
sabine.workspace = true
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
specta-typescript.workspace = true
tokio = { workspace = true, features = ["rt"] }
ureq.workspace = true
zbus = { workspace = true, features = ["proxy", "tokio"] }

[lints]
workspace = true
