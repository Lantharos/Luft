# How a process is judged from its /proc folder, the same rules for Luft's
# services (luft-identity) and Kestrel's compositor (Mutter patch 0016).
#
# Each group is one process:
#   info        the .flatpak-info at the root of what it sees; none means it has none
#   info-link   true when that .flatpak-info is a symbolic link instead
#   hidden      true when its root can't be looked into, as for a process that
#               keeps others out of its memory
#   mountinfo   its mount table; none means the table can't be read
#   expect      you, app or unknown
#   app         the app ID, when expect is app
#
# Values use GLib key file escapes: \n, \s, \t, \r and \\.

[A process outside a sandbox]
mountinfo=25 1 0:22 / / rw,relatime shared:1 - btrfs /dev/nvme0n1p3 rw\n
expect=you

[A Flatpak app]
info=[Application]\nname=org.example.Notes\nruntime=runtime/org.gnome.Platform/x86_64/49\n\n[Instance]\ninstance-id=1234\n
expect=app
app=org.example.Notes

[The app ID comes from the Application group]
info=[Instance]\nname=org.example.Fake\n\n[Application]\nname=org.example.Notes\n
expect=app
app=org.example.Notes

[A sandbox for a runtime alone is unknown]
info=[Runtime]\nname=org.gnome.Platform\n
expect=unknown

[An empty sandbox info is unknown]
info=
expect=unknown

[An empty app ID is unknown]
info=[Application]\nname=\n
expect=unknown

[A blank app ID is unknown]
info=[Application]\nname=\s\s\s\n
expect=unknown

[Spaces around the equals sign]
info=[Application]\nname = org.example.Notes\n
expect=app
app=org.example.Notes

[Spaces after the app ID belong to it]
info=[Application]\nname=org.example.Notes\s\s\n
expect=app
app=org.example.Notes\s\s

[Indented lines]
info=\s\s[Application]\n\tname=org.example.Notes\n
expect=app
app=org.example.Notes

[Windows line endings]
info=[Application]\r\nname=org.example.Notes\r\n
expect=app
app=org.example.Notes

[Translated names are not the app ID]
info=[Application]\nname[de]=org.example.Fake\nname=org.example.Notes\n
expect=app
app=org.example.Notes

[Comments]
info=# name=org.example.Fake\n[Application]\n# name=org.example.Fake\nname=org.example.Notes\n
expect=app
app=org.example.Notes

[The last name counts]
info=[Application]\nname=org.example.First\nname=org.example.Second\n
expect=app
app=org.example.Second

[A repeated group continues the first]
info=[Application]\nname=org.example.First\n[Instance]\n[Application]\nname=org.example.Second\n
expect=app
app=org.example.Second

[A repeated group keeps what the first said]
info=[Application]\nname=org.example.First\n[Instance]\n[Application]\nruntime=runtime/org.gnome.Platform\n
expect=app
app=org.example.First

[Escapes in the app ID]
info=[Application]\nname=org\\sexample\n
expect=app
app=org\sexample

[An unknown escape makes the app unknown]
info=[Application]\nname=org\\qexample\n
expect=unknown

[Keys before the first group make the info unreadable]
info=name=org.example.Fake\n[Application]\nname=org.example.Notes\n
expect=unknown

[A line that is neither a group nor a key makes the info unreadable]
info=[Application]\nname=org.example.Notes\nnot a key\n
expect=unknown

[Semicolons don't start comments]
info=[Application]\n; a note\nname=org.example.Notes\n
expect=unknown

[An unclosed group makes the info unreadable]
info=[Application\nname=org.example.Notes\n
expect=unknown

[Text after a group makes the info unreadable]
info=[Application]x\nname=org.example.Notes\n
expect=unknown

[Spaces after a group]
info=[Application]\s\s\nname=org.example.Notes\n
expect=app
app=org.example.Notes

[Group names keep their spaces]
info=[\sApplication\s]\nname=org.example.Notes\n
expect=unknown

[A key without a name makes the info unreadable]
info=[Application]\n=org.example.Fake\nname=org.example.Notes\n
expect=unknown

[An invalid key makes the info unreadable]
info=[Application]\nna[me=org.example.Fake\nname=org.example.Notes\n
expect=unknown

[A hidden root without a sandbox mount]
hidden=true
mountinfo=25 1 0:22 / / rw,relatime shared:1 - btrfs /dev/nvme0n1p3 rw\n
expect=you

[A hidden root in a sandbox]
hidden=true
mountinfo=25 1 0:22 / / rw,relatime shared:1 - btrfs /dev/nvme0n1p3 rw\n120 25 0:52 /flatpak-info /.flatpak-info ro,nosuid,nodev - tmpfs tmpfs rw\n
expect=unknown

[A hidden root with a hidden mount table]
hidden=true
expect=unknown

[Only the mount point marks a sandbox]
hidden=true
mountinfo=25 1 0:22 / / rw,relatime shared:1 - btrfs /dev/nvme0n1p3 rw\n120 25 0:52 /.flatpak-info /run/info ro,nosuid,nodev - tmpfs tmpfs rw\n
expect=you

[A link in place of the sandbox info]
info-link=true
mountinfo=25 1 0:22 / / rw,relatime shared:1 - btrfs /dev/nvme0n1p3 rw\n
expect=you
