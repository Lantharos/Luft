[package]
name = "luft-disks"
version = "0.1.0"
description = "Drives, partitions, mounting and resizing through UDisks, shared by Disks and Luft's installer"
authors = ["Kristof"]
license = "MIT"
edition = "2024"
rust-version = "1.98"

[dependencies]
futures-util = { version = "0.3.34", default-features = false }
libc = "0.2.190"
luft-dbus = { path = "../dbus" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
zbus = { version = "6.0.0", default-features = false, features = ["proxy", "tokio"] }

[dev-dependencies]
tokio = { version = "1.53.3", default-features = false, features = ["macros", "rt"] }
