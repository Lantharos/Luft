[package]
name = "tern"
version = "0.1.0"
description = "A terminal for Luft"
authors = ["Kristof"]
license = "GPL-3.0-or-later"
edition = "2024"
rust-version = "1.98"

[lib]
name = "tern_lib"

[dependencies]
base64 = "0.23.1"
dirs = "7.0.0"
luft-app = { path = "../../../packages/app", features = ["launch", "settings"] }
parking_lot = "0.12.5"
rustix = { version = "1.1.5", features = ["event", "fs", "pipe", "process", "pty", "stdio", "termios"] }
sabine = { git = "https://github.com/Lantharos/Sabine", tag = "v0.51" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uzers = "0.12.2"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
