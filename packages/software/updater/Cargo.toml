[package]
name = "luft-updater"
version = "0.1.0"
description = "Checks, downloads and rolls back Luft's system image with bootc for Settings and the shell"
authors = ["Kristof"]
license = "MIT"
edition = "2024"
rust-version = "1.98"

[dependencies]
access = { path = "../../../security/crates/access" }
anyhow = "1.0.104"
libc = "0.2.190"
luft-variant = { path = "../../variant" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", default-features = false, features = ["rt", "macros", "time", "sync"] }
walkdir = "2.5.0"
zbus = { version = "6.0.0", default-features = false, features = ["tokio"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true
