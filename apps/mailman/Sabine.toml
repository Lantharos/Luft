[app]
id = "com.lantharos.mailman"
name = "Mailman"
generic_name = "Mail"
categories = ["Network", "Email", "Office"]
keywords = ["mail", "email", "e-mail", "inbox", "imap", "smtp", "jmap", "gmail", "outlook", "fastmail", "newsletter", "thunderbird", "evolution", "geary"]
version = "0.1.0"
icon = "public/favicon.svg"
cargo_manifest = "desktop/Cargo.toml"
mime_types = ["x-scheme-handler/mailto", "message/rfc822"]
autostart_arguments = "--background"

[app.extensions]
"message/rfc822" = ["eml"]

[install]
command = "cargo run --manifest-path desktop/Cargo.toml --"

[web]
root = "."
dist = "dist"
entry = "dist/index.html"
build = "bun run build"
local_files = true

[updates]
provider = "schelf"

[sandbox]
unsandboxed = true
reason = "It keeps your accounts' passwords in Luft Keyring and listens on the system bus for the computer waking up and the network coming back."

[bindings]
path = "src/lib/bindings.ts"
