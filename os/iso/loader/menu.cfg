set default=0
set timeout_style=hidden
set timeout=0
set gfxpayload=keep

menuentry 'Luft' --class luft {
  linux ${folder}/boot/vmlinuz root=luft-live:${medium}${folder} @ARGUMENTS@
  initrd ${folder}/boot/initrd.img
}

menuentry 'Luft with basic graphics' --class luft {
  linux ${folder}/boot/vmlinuz root=luft-live:${medium}${folder} @ARGUMENTS@ nomodeset
  initrd ${folder}/boot/initrd.img
}

menuentry 'Firmware settings' {
  fwsetup
}
