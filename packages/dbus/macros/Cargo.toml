[package]
name = "luft-dbus-macros"
version = "0.1.0"
description = "Keeps the introspection of Luft's D-Bus interfaces and proxies in packages/dbus/introspection current"
authors = ["Kristof"]
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2.workspace = true
quote.workspace = true
syn = { workspace = true, features = ["full", "visit-mut"] }
zbus_utils.workspace = true

[lints]
workspace = true
