name: Signing keys
description: Writes Luft's signing keys for the build, after checking them against the public halves in os/image/keys.

inputs:
  key:
    description: LUFT_SECUREBOOT_KEY
    required: true
  certificate:
    description: LUFT_SECUREBOOT_CERT
    required: true
  seal:
    description: Whether the job seals images, which needs a TPM policy key for every generation in os/versions.env
    default: "false"
  pcr-key-2:
    description: LUFT_PCR_KEY_2
    required: false

runs:
  using: composite
  steps:
    - name: Signing keys
      shell: bash
      env:
        KEY: ${{ inputs.key }}
        CERT: ${{ inputs.certificate }}
        SEAL: ${{ inputs.seal }}
        PCR_KEY_2: ${{ inputs.pcr-key-2 }}
      run: |
        [[ -n "$KEY" && -n "$CERT" ]] || { echo "::error::LUFT_SECUREBOOT_KEY or LUFT_SECUREBOOT_CERT isn't set."; exit 1; }
        keys="$RUNNER_TEMP/secure-boot"
        mkdir -m 700 "$keys"
        printf '%s\n' "$KEY" > "$keys/key.pem"
        printf '%s\n' "$CERT" > "$keys/cert.pem"
        cmp <(openssl x509 -in "$keys/cert.pem" -outform DER) os/image/keys/luft-secureboot.der ||
          { echo "::error::LUFT_SECUREBOOT_CERT isn't the certificate in os/image/keys"; exit 1; }
        {
          echo "LUFT_KEYS=$keys"
          echo "LUFT_SECUREBOOT_KEY=$keys/key.pem"
          echo "LUFT_SECUREBOOT_CERT=$keys/cert.pem"
        } >> "$GITHUB_ENV"
        [[ "$SEAL" == true ]] || exit 0
        source os/versions.env
        for generation in ${PCR_GENERATIONS//,/ }; do
          name="PCR_KEY_$generation"
          [[ -n "${!name:-}" ]] || { echo "::error::The TPM policy key of generation $generation isn't set."; exit 1; }
          printf '%s\n' "${!name}" > "$keys/pcr-$generation.pem"
          cmp <(openssl pkey -in "$keys/pcr-$generation.pem" -pubout) "os/image/keys/pcr/$generation.pem" ||
            { echo "::error::The TPM policy key of generation $generation doesn't match os/image/keys/pcr/$generation.pem"; exit 1; }
          echo "LUFT_PCR_KEY_$generation=$keys/pcr-$generation.pem" >> "$GITHUB_ENV"
        done
