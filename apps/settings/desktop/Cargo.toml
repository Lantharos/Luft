[package]
name = "settings"
version = "0.1.0"
description = "Settings for Luft"
authors = ["Kristof"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
name = "settings_lib"

[dependencies]
dirs = "7.0.0"
getrandom = "0.4.3"
gio = "0.22.10"
gio-unix = "0.22.8"
gstreamer = "0.25.4"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
jxl-oxide = { version = "0.12.6", features = ["image"] }
libc = "0.2.189"
libpulse-binding = "2.30.1"
luft-app = { path = "../../../packages/app", features = ["apps"] }
roxmltree = "0.21.1"
sabine = { git = "https://github.com/Lantharos/Sabine", tag = "v0.31" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", default-features = false, features = ["sync"] }
x25519-dalek = { version = "3.0.0", default-features = false }
zbus = { version = "5.19.0", default-features = false, features = ["blocking-api", "tokio"] }
