id = "com.lantharos.Rain"
name = "Rain"
description = "Rain falls over the wallpaper and splashes on windows and the taskbar, or plays as sound while you work."
version = "1.0.0"
api = 1
permissions = ["wallpaper", "quick-settings"]

[helper]
path = "rain-sound"

[[settings]]
key = "rain"
type = "switch"
label = "rain"
default = false

[[settings]]
key = "intensity"
depends = "rain"
type = "choice"
label = "intensity"
default = "rain"
options = [
  { value = "drizzle", label = "drizzle" },
  { value = "rain", label = "steady" },
  { value = "storm", label = "storm" },
]

[[settings]]
key = "color"
depends = "rain"
type = "color"
label = "color"
default = "#dbe6f7"
swatches = [
  { value = "#dbe6f7", label = "water" },
  { value = "accent", label = "accent" },
]

[[settings]]
key = "visible"
depends = "rain"
type = "switch"
label = "visible"
default = true

[[settings]]
key = "sound"
depends = "rain"
type = "switch"
label = "sound"
default = false

[[settings]]
key = "volume"
type = "slider"
label = "volume"
default = 0.6
min = 0
max = 1
step = 0.05
unit = "percent"
depends = "sound"
