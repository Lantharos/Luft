[app]
id = "com.lantharos.meet"
name = "Meet Luft"
generic_name = "Luft installer for Windows"
categories = ["System"]
keywords = ["luft", "install", "dual boot", "linux"]
version = "0.1.2"
maintainer = "Lantharos <kristof@lanth.me>"
icon = "public/favicon.svg"
installer_image = "desktop/installer.png"
cargo_manifest = "desktop/Cargo.toml"

[web]
root = "."
dist = "dist"
entry = "dist/index.html"
build = "bun run build"
local_files = true

[updates]
provider = "schelf"
policy = "disabled"

[sandbox]
unsandboxed = true
reason = "It checks and resizes disks and prepares the computer to start Luft."

[bindings]
path = "src/lib/bindings.ts"
