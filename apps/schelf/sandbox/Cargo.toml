[package]
name = "luft-sandbox"
version = "0.1.0"
description = "Runs AppImages in a sandbox with their own app ID, data folder and the permissions given to them"
authors = ["Kristof"]
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
futures-util.workspace = true
landlock.workspace = true
libc.workspace = true
luft-i18n.workspace = true
luft-identity.workspace = true
luft-software.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "time"] }
wayland-client.workspace = true
wayland-protocols = { workspace = true, features = ["client", "staging"] }
zbus = { workspace = true, features = ["proxy", "tokio"] }

[lints]
workspace = true
