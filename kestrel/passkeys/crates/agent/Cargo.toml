[package]
name = "luft-passkeys"
description = "Keeps passkeys in Luft Keyring and answers browsers through the passkey relay"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
ctap.workspace = true
libc.workspace = true
luft-dbus-macros.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
zbus = { workspace = true, features = ["proxy", "service", "tokio"] }
zeroize.workspace = true

[lints]
workspace = true
