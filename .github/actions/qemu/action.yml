name: QEMU
description: Installs QEMU, its UEFI firmware and swtpm, and lets the runner's account use KVM, for the VMs in os/vm.

runs:
  using: composite
  steps:
    - name: QEMU with KVM
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules > /dev/null
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
        sudo apt-get update --quiet
        sudo apt-get install --yes --quiet --no-install-recommends qemu-system-x86 qemu-utils ovmf swtpm
        sudo apparmor_parser --remove /etc/apparmor.d/usr.bin.swtpm
