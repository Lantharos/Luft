id = "com.example.Probe"
name = "Probe"
description = "Uses every part of the extension API that a check can watch."
version = "1.0.0"
api = 1
permissions = ["taskbar", "quick-settings", "search", "notifications"]

[[settings]]
key = "on"
type = "switch"
label = "on"
default = false

[[settings]]
key = "mood"
type = "choice"
label = "mood"
default = "calm"
options = [
  { value = "calm", label = "calm" },
  { value = "giddy", label = "giddy" },
]

[[settings]]
key = "level"
type = "slider"
label = "level"
default = 0.5
min = 0
max = 1
unit = "percent"
depends = "on"

[[settings]]
key = "giddy-only"
type = "switch"
label = "giddy-only"
default = false
depends = "mood"
when = ["giddy"]

[[settings]]
key = "high-only"
type = "switch"
label = "high-only"
default = false
depends = "level"
when = { min = 0.75 }

[[settings]]
key = "senses"
type = "choices"
label = "senses"
default = ["sight"]
min = 1
options = [
  { value = "sight", label = "sight" },
  { value = "hearing", label = "hearing" },
]

[[settings]]
key = "hearing-only"
type = "switch"
label = "hearing-only"
default = false
depends = "senses"
when = ["hearing"]

[[settings]]
key = "while-off"
type = "switch"
label = "while-off"
default = false
depends = "giddy-only"
when = [false]
