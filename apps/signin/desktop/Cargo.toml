[package]
name = "signin"
version = "0.1.0"
description = "Signs in to Wi-Fi networks that ask for it first"
authors = ["Kristof"]
license = "MIT"
edition = "2024"
rust-version = "1.93"

[lib]
name = "signin_lib"

[dependencies]
luft-app = { path = "../../../packages/app" }
sabine = { git = "https://github.com/Lantharos/Sabine", tag = "v0.35" }
sabine-service = { git = "https://github.com/Lantharos/Sabine", tag = "v0.35" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
zbus = { version = "5.19.0", default-features = false, features = ["blocking-api", "tokio"] }

