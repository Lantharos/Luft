id = "com.lantharos.Strays"
name = "Strays"
description = "A few small creatures who live on your desktop and get up to things on the taskbar, the tops of your windows and with each other."
version = "1.0.0"
api = 1
permissions = ["wallpaper", "quick-settings", "calls"]

[[settings]]
key = "on"
type = "switch"
label = "strays"
default = true

[[settings]]
key = "count"
depends = "on"
type = "slider"
label = "count"
default = 2
min = 1
max = 6
step = 1

[[settings]]
key = "activity"
depends = "on"
type = "choice"
label = "activity"
default = "lively"
options = [
  { value = "sleepy", label = "sleepy" },
  { value = "lively", label = "lively" },
  { value = "restless", label = "restless" },
]

[[settings]]
key = "size"
depends = "on"
type = "choice"
label = "size"
default = "medium"
options = [
  { value = "small", label = "small" },
  { value = "medium", label = "medium" },
  { value = "large", label = "large" },
]

[luft]
minimum = "1.0-nightly.27"
