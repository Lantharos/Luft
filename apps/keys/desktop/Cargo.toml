[package]
name = "keys"
version = "0.1.0"
description = "Keyboard layouts and input methods for Luft"
authors = ["Kristof"]
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "keys_lib"

[dependencies]
dirs.workspace = true
futures-util.workspace = true
gio.workspace = true
libc.workspace = true
luft-app = { workspace = true, features = ["ibus", "watch"] }
roxmltree.workspace = true
sabine.workspace = true
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
tokio = { workspace = true, features = ["fs", "macros", "rt", "sync", "time"] }
toml.workspace = true
xkbcommon.workspace = true
zbus = { workspace = true, features = ["proxy", "service", "tokio"] }

[lints]
workspace = true
