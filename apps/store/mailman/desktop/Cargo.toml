[package]
name = "mailman"
version = "0.1.0"
description = "Mail for Luft"
authors = ["Kristof"]
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "mailman_lib"

[dependencies]
ammonia.workspace = true
base64.workspace = true
crossbeam-channel.workspace = true
dirs.workspace = true
futures-util.workspace = true
gio.workspace = true
hickory-resolver.workspace = true
lol_html.workspace = true
lettre = { workspace = true, features = ["hostname", "ring", "rustls", "rustls-platform-verifier", "smtp-transport"] }
luft-app = { workspace = true, features = ["apps", "launch"] }
mail-builder.workspace = true
mail-parser.workspace = true
parking_lot.workspace = true
rand.workspace = true
roxmltree.workspace = true
rusqlite = { workspace = true, features = ["bundled"] }
rustls = { workspace = true, features = ["logging", "ring", "std", "tls12"] }
rustls-platform-verifier.workspace = true
sabine.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
socket2.workspace = true
specta.workspace = true
tokio = { workspace = true, features = ["fs", "rt", "time"] }
ureq = { workspace = true, features = ["json"] }
url.workspace = true
zbus = { workspace = true, features = ["proxy", "tokio"] }

[lints]
workspace = true
