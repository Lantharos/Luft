name: Helium

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  follow:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Follow Helium's latest release
        env:
          GH_TOKEN: ${{ github.token }}
          FILE: os/image/parts/helium/version
        run: |
          latest="$(gh release view --repo imputnet/helium-linux --json tagName --jq .tagName)"
          [[ "$latest" =~ ^[0-9]+(\.[0-9]+)+$ ]] || { echo "Unexpected Helium release $latest" >&2; exit 1; }
          [[ "$latest" != "$(cat "$FILE")" ]] || exit 0
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$FILE" \
            -f message="Update Helium to $latest" \
            -f content="$(echo "$latest" | base64)" \
            -f sha="$(git rev-parse "HEAD:$FILE")" \
            -f branch="$GITHUB_REF_NAME"
