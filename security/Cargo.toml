[workspace]
resolver = "3"
members = ["crates/access", "crates/trust", "crates/usb"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Lantharos/Luft"
rust-version = "1.98"

[workspace.dependencies]
access = { path = "crates/access" }

anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
rustix = { version = "1.1.5", features = ["fs", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", default-features = false, features = ["rt", "macros", "time", "sync", "process", "io-util", "signal"] }
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true
