[workspace]
members = [
    "crates/kestrel",
    "crates/luft-config",
    "crates/luft-ipc",
    "crates/luft-portal",
    "crates/luft-session",
    "crates/luft-shell",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
bitflags = "2.13.1"
calloop = { version = "0.14.4", features = ["signals"] }
clap = { version = "4.6.4", features = ["derive"] }
glam = "0.33.2"
input = "0.10.0"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
smithay = { git = "https://github.com/Smithay/smithay.git", rev = "60aafc2b1a64395bd32ec93f41e6712a07544c34", default-features = false, features = ["desktop", "wayland_frontend"] }
smithay-drm-extras = { git = "https://github.com/Smithay/smithay.git", rev = "60aafc2b1a64395bd32ec93f41e6712a07544c34" }
thiserror = "2.0.19"
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
wayland-backend = "0.3.16"
wayland-scanner = "0.31.11"
wayland-server = "0.31.14"

luft-config = { path = "crates/luft-config" }
luft-ipc = { path = "crates/luft-ipc" }
luft-session = { path = "crates/luft-session" }

[profile.dev.package."kestrel"]
opt-level = 2

[profile.dev.package."luft-shell"]
opt-level = 2

[profile.dev.package."smithay"]
opt-level = 2
