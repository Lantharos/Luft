[package]
name = "luft-crash-reports"
version = "0.1.0"
description = "Asks whether to send reports of crashes of Luft's own programs, and sends the ones people agree to"
authors = ["Kristof"]
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
dirs.workspace = true
futures-util.workspace = true
getrandom.workspace = true
luft-crash-report.workspace = true
luft-dbus = { workspace = true, features = ["service"] }
luft-dbus-macros.workspace = true
luft-identity.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "signal", "sync", "time"] }
toml.workspace = true
ureq.workspace = true
zbus = { workspace = true, features = ["service", "tokio"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
