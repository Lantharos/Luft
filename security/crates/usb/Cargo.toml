[package]
name = "luft-usb-protection"
description = "Holds back USB devices connected while nobody is signed in and unlocked"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
futures-util = { workspace = true, features = ["std"] }
luft-dbus.workspace = true
luft-dbus-macros.workspace = true
luft-identity.workspace = true
rustix = { workspace = true, features = ["fs", "net", "process"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
zbus = { workspace = true, features = ["proxy", "service", "tokio"] }

[lints]
workspace = true
