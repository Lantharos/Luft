name: Checks

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Affected checks
    runs-on: ubuntu-slim
    timeout-minutes: 10
    outputs:
      rust: ${{ steps.affected.outputs.rust }}
      uefi: ${{ steps.affected.outputs.uefi }}
      meet-windows: ${{ steps.affected.outputs.meet-windows }}
      web: ${{ steps.affected.outputs.web }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - id: affected
        run: bun .github/scripts/affected/index.ts

  rust:
    name: Rust
    needs: changes
    if: needs.changes.outputs.rust != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    container: fedora:45
    steps:
      - name: Install build dependencies
        run: >-
          dnf install --assumeyes --setopt=install_weak_deps=False
          git rustup gcc gcc-c++ clang-devel cmake pkgconf-pkg-config
          glib2-devel gstreamer1-devel pipewire-devel pulseaudio-libs-devel
          fontconfig-devel wayland-devel libxkbcommon-devel libdrm-devel
          pam-devel systemd-devel libseccomp-devel tpm2-tss-devel sqlite-devel
          onnxruntime-devel vulkan-headers vulkan-loader-devel glslc swtpm

      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup-init -y --profile minimal --component clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux

      - run: cargo clippy --locked --all-targets ${{ needs.changes.outputs.rust }} -- -D warnings

      - run: cargo test --locked ${{ needs.changes.outputs.rust }}

  uefi:
    name: Rust UEFI
    needs: changes
    if: needs.changes.outputs.uefi != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - run: rustup toolchain install stable --profile minimal --component clippy --target x86_64-unknown-uefi

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: uefi

      - run: cargo clippy --locked ${{ needs.changes.outputs.uefi }} --target x86_64-unknown-uefi -- -D warnings

  meet-windows:
    name: Rust Meet Luft for Windows
    needs: changes
    if: needs.changes.outputs.meet-windows == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    container: fedora:45
    steps:
      - name: Install build dependencies
        run: dnf install --assumeyes --setopt=install_weak_deps=False git rustup gcc mingw64-gcc

      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup-init -y --profile minimal --component clippy --target x86_64-pc-windows-gnu
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows

      - run: cargo clippy --locked -p meet --all-targets --target x86_64-pc-windows-gnu -- -D warnings

  web:
    name: TypeScript ${{ matrix.target }}
    needs: changes
    if: needs.changes.outputs.web != '[]'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.changes.outputs.web) }}
    defaults:
      run:
        working-directory: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-

      - run: bun install --frozen-lockfile
        working-directory: .

      - run: bun run check

  checks:
    name: Checks
    needs: [changes, rust, uefi, meet-windows, web]
    if: always()
    runs-on: ubuntu-slim
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
