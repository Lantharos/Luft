summary = "Send files and text to your phone and back, with LocalSend"
description = "Pigeon sends files, folders and text between this computer and phones, tablets and computers on the same Wi-Fi that have LocalSend, on Android, iPhone, Windows, macOS or Linux. Drop files on Pigeon in the taskbar, click it to pick a device, right-click files in Rover and choose Send to device, or pick a device in the Send sheet of apps such as Flatbed. When something comes in, a small window says who sends what and how big it is, then shows it arriving. Devices you trust can send without asking, and text from them lands straight on your clipboard. Everything goes directly between your devices, encrypted, without an account or the internet, and a PIN can keep strangers out."
