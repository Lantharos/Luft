name: ISO

on:
  workflow_run:
    workflows: [Image]
    types: [completed]
  workflow_dispatch:
    inputs:
      image:
        description: Image to build the ISO from
        default: ghcr.io/lantharos/luft:45

concurrency:
  group: iso-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: ISO ${{ matrix.edition }}
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       ((github.event.workflow_run.event == 'push' && startsWith(github.event.workflow_run.head_branch, 'v')) ||
        github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      matrix:
        edition: [universal, standard, nvidia]
    outputs:
      channel: ${{ steps.channel.outputs.channel }}
      version: ${{ steps.channel.outputs.version }}
      skip: ${{ steps.channel.outputs.skip }}
    env:
      DOWNLOADS: https://get.luft.computer
      LUFT_ISO: ${{ github.workspace }}/iso
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      SIGNING: ${{ secrets.LUFT_ISO_MINISIGN_KEY != '' }}
    steps:
      - name: Make room
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: sigstore/cosign-installer@v4.1.2

      - name: Sign in to the registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io --username "${{ github.actor }}" --password-stdin
          echo "${{ secrets.GITHUB_TOKEN }}" | cosign login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Image and channel
        id: channel
        env:
          EDITION: ${{ matrix.edition }}
          CHOSEN: ${{ inputs.image }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [[ -n "$CHOSEN" ]]; then
            image="$CHOSEN"
          elif [[ "$RUN_EVENT" == push ]]; then
            image="ghcr.io/lantharos/luft:${RUN_TAG#v}"
          else
            image=ghcr.io/lantharos/luft:45-nightly
          fi
          version="$(skopeo inspect --format '{{index .Labels "org.opencontainers.image.version"}}' "docker://$image")"
          if [[ "$version" == *-nightly ]]; then channel=nightly; else channel=latest; fi
          if [[ "$EDITION" == universal ]]; then iso="luft-$version.iso"; else iso="luft-$version-$EDITION.iso"; fi
          if [[ "$channel" == nightly ]]; then published="$(curl -sf "$DOWNLOADS/luft-nightly.version" || true)"
          elif curl -sfIo /dev/null "$DOWNLOADS/$iso"; then published="$version"; fi
          if [[ "$GITHUB_EVENT_NAME" == workflow_run && "${published:-}" == "$version" ]]; then
            echo "$iso is already published."
            echo "SKIP=1" >> "$GITHUB_ENV"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "CHANNEL=$channel" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Check the images' signatures
        if: env.SKIP != '1'
        env:
          EDITION: ${{ matrix.edition }}
          SIGNER: ^https://github\.com/${{ github.repository }}/\.github/workflows/image\.yml@refs/(heads/main|tags/v.+)$
        run: |
          references=("$IMAGE")
          [[ "$EDITION" == standard ]] || references+=("$IMAGE-nvidia")
          for reference in "${references[@]}"; do
            podman pull --quiet "$reference" > /dev/null
            digest="$(podman image inspect --format '{{.Digest}}' "$reference")"
            if ! checked="$(cosign verify --certificate-identity-regexp "$SIGNER" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "${reference%:*}@$digest" 2>&1 > /dev/null)"; then
              if grep -qi "no signatures found" <<<"$checked"; then
                echo "::notice::$reference was built before images were signed"
                continue
              fi
              echo "$checked" >&2
              exit 1
            fi
          done

      - name: Build
        if: env.SKIP != '1'
        run: |
          mkdir -p "$LUFT_ISO"
          os/iso/build.sh "$IMAGE" "${{ matrix.edition }}"
          ls -l "$LUFT_ISO"

      - name: Checksum for the channel
        if: env.SKIP != '1'
        working-directory: ${{ env.LUFT_ISO }}
        run: |
          iso="$(ls luft-*.iso)"
          alias="luft-$CHANNEL${iso#luft-"$VERSION"}"
          sed "s/$iso/$alias/" "$iso.sha256" > "$alias.sha256"
          echo "ISO_NAME=$iso" >> "$GITHUB_ENV"
          echo "ALIAS=$alias" >> "$GITHUB_ENV"

      - name: Sign the checksums
        if: env.SKIP != '1' && env.SIGNING == 'true'
        working-directory: ${{ env.LUFT_ISO }}
        env:
          LUFT_ISO_MINISIGN_KEY: ${{ secrets.LUFT_ISO_MINISIGN_KEY }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes minisign
          key="$RUNNER_TEMP/luft-iso.key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$LUFT_ISO_MINISIGN_KEY" > "$key"
          for name in "$ISO_NAME" "$ALIAS"; do
            minisign -S -s "$key" -m "$name.sha256" -t "$name"
          done

      - name: Upload to R2
        if: env.SKIP != '1' && env.R2_ACCOUNT_ID != '' && env.R2_BUCKET != ''
        working-directory: ${{ env.LUFT_ISO }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          endpoint="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          s3() { aws s3 "$@" --endpoint-url "$endpoint" --no-progress; }
          publish() {
            s3 cp "$ISO_NAME" "s3://$R2_BUCKET/$1"
            if [[ -e "$1.sha256.minisig" ]]; then
              s3 cp "$1.sha256.minisig" "s3://$R2_BUCKET/$1.sha256.minisig"
            fi
            s3 cp "$1.sha256" "s3://$R2_BUCKET/$1.sha256"
          }
          if [[ "$CHANNEL" == latest ]]; then
            publish "$ISO_NAME"
          fi
          publish "$ALIAS"

      - name: Keep as a workflow artifact
        if: env.SKIP != '1' && (env.R2_ACCOUNT_ID == '' || env.R2_BUCKET == '')
        uses: actions/upload-artifact@v7
        with:
          name: luft-iso-${{ matrix.edition }}
          path: ${{ env.LUFT_ISO }}/luft-*
          compression-level: 0
          retention-days: 14

  nightly:
    name: Nightly version
    needs: build
    if: needs.build.outputs.channel == 'nightly' && needs.build.outputs.skip != '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Publish the version once every stick is up
        if: env.R2_ACCOUNT_ID != '' && env.R2_BUCKET != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          endpoint="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          echo "$VERSION" | aws s3 cp - "s3://$R2_BUCKET/luft-nightly.version" --endpoint-url "$endpoint" --no-progress
          aws s3 rm "s3://$R2_BUCKET/" --endpoint-url "$endpoint" --only-show-errors --recursive --exclude '*' --include 'luft-*-nightly.iso' --include 'luft-*-nightly.iso.sha256' --include 'luft-*-nightly.iso.sha256.minisig'
