[package]
name = "draft"
version = "0.1.0"
description = "A text and code editor for Luft"
authors = ["Kristof"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
name = "draft_lib"

[dependencies]
chardetng = "1.0.0"
dirs = "7.0.0"
encoding_rs = "0.8.42"
ignore = "0.4.33"
luft-app = { path = "../../../packages/app" }
notify = { version = "8.2.0", default-features = false }
parking_lot = "0.12.5"
sabine = { git = "https://github.com/Lantharos/Sabine", tag = "v0.31" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
zbus = { version = "5.19.0", default-features = false, features = ["blocking-api", "tokio"] }
