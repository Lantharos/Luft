[package]
name = "luft-policy"
version = "0.1.0"
description = "The settings an organization locks on its computers, read from Luft's policy files by every service and app that applies them"
authors = ["Kristof"]
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
follow = ["dep:futures-util", "dep:inotify", "dep:tokio"]

[dependencies]
futures-util = { workspace = true, optional = true }
inotify = { workspace = true, features = ["stream"], optional = true }
luft-variant.workspace = true
serde.workspace = true
specta.workspace = true
tokio = { workspace = true, features = ["time"], optional = true }
toml.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[lints]
workspace = true
