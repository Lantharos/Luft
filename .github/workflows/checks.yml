name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  changes:
    name: Affected checks
    runs-on: ubuntu-slim
    timeout-minutes: 10
    outputs:
      rust: ${{ steps.affected.outputs.rust }}
      uefi: ${{ steps.affected.outputs.uefi }}
      meet-windows: ${{ steps.affected.outputs.meet-windows }}
      web: ${{ steps.affected.outputs.web }}
      kestrel: ${{ steps.affected.outputs.kestrel }}
      units: ${{ steps.affected.outputs.units }}
      weblate: ${{ steps.affected.outputs.weblate }}
      compositor: ${{ steps.affected.outputs.compositor }}
      dbus: ${{ steps.affected.outputs.dbus }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - id: affected
        run: bun .github/scripts/affected/index.ts

  rust:
    name: Rust ${{ matrix.check }} ${{ matrix.group.name }}
    needs: changes
    if: needs.changes.outputs.rust != '[]'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    container:
      image: ghcr.io/lantharos/luft-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        check: [clippy, test]
        group: ${{ fromJSON(needs.changes.outputs.rust) }}
    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.check }}-${{ matrix.group.name }}
          cache-bin: false

      - if: matrix.check == 'clippy'
        run: cargo clippy --locked --all-targets ${{ matrix.group.packages }} -- -D warnings

      - if: matrix.check == 'test'
        run: cargo test --locked ${{ matrix.group.packages }}

      - if: matrix.check == 'test' && matrix.group.name == 'apps'
        run: .github/scripts/bindings/check.sh ${{ matrix.group.packages }}

  uefi:
    name: Rust UEFI
    needs: changes
    if: needs.changes.outputs.uefi != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    container:
      image: ghcr.io/lantharos/luft-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: uefi
          cache-bin: false

      - run: cargo clippy --locked ${{ needs.changes.outputs.uefi }} --target x86_64-unknown-uefi -- -D warnings

  meet-windows:
    name: Rust Meet Luft for Windows
    needs: changes
    if: needs.changes.outputs.meet-windows == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    container:
      image: ghcr.io/lantharos/luft-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows
          cache-bin: false

      - run: cargo clippy --locked -p meet --all-targets --target x86_64-pc-windows-gnu -- -D warnings

  web:
    name: TypeScript ${{ matrix.target }}
    needs: changes
    if: needs.changes.outputs.web != '[]'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.changes.outputs.web) }}
    defaults:
      run:
        working-directory: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-

      - run: bun install --frozen-lockfile
        working-directory: .

      - run: bun run check

  kestrel:
    name: Kestrel
    needs: changes
    if: needs.changes.outputs.kestrel == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      LUFT_CI_KESTREL: ghcr.io/lantharos/luft-ci-kestrel:latest
      CCACHE_DIR: ${{ github.workspace }}/kestrel/run/ccache
      KESTREL_SESSION_DIR: ${{ github.workspace }}/kestrel/run/smoke
      KESTREL_CAPTURE_DIR: ${{ github.workspace }}/kestrel/run/smoke/screenshots
      SMOKE_GROUPS: system:session,start:search,lockScreen:lock,lockScreen:unlock,panel:surfaces,system:watchdog
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/registry

      - name: Build container
        id: container
        run: |
          podman pull --quiet "$LUFT_CI_KESTREL" > /dev/null
          echo "digest=$(podman image inspect --format '{{.Digest}}' "$LUFT_CI_KESTREL")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        id: mutter
        with:
          path: kestrel/run/mutter-install
          key: mutter-${{ steps.container.outputs.digest }}-${{ hashFiles('kestrel/compositor/**') }}

      - uses: actions/cache@v6
        with:
          path: kestrel/run/ccache
          key: kestrel-ccache-${{ hashFiles('kestrel/compositor/**', 'kestrel/engine/**') }}
          restore-keys: kestrel-ccache-

      - uses: actions/cache@v6
        with:
          path: |
            kestrel/run/home/.cargo/registry
            kestrel/run/home/.bun/install/cache
            target
          key: kestrel-cargo-${{ steps.container.outputs.digest }}-${{ hashFiles('Cargo.lock', 'bun.lock') }}
          restore-keys: kestrel-cargo-${{ steps.container.outputs.digest }}-

      - name: Patch series
        run: |
          python3 kestrel/compositor/patches.py prepare
          python3 kestrel/compositor/patches.py check

      - name: Mutter
        if: steps.mutter.outputs.cache-hit != 'true'
        run: .github/scripts/kestrel/container.sh run kestrel/compositor/build.sh

      - name: Engine
        run: |
          .github/scripts/kestrel/container.sh run bun install --frozen-lockfile
          .github/scripts/kestrel/container.sh run meson setup kestrel/build kestrel/engine \
            "-Dpkg_config_path=$PWD/kestrel/run/mutter-install/lib/pkgconfig" "--prefix=$PWD/kestrel/install"
          .github/scripts/kestrel/container.sh run meson compile -C kestrel/build

      - name: Headless session
        run: .github/scripts/kestrel/container.sh run kestrel/tools/session.sh capture --only "$SMOKE_GROUPS"

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: kestrel-session
          path: |
            kestrel/run/smoke/capture/logs
            kestrel/run/smoke/capture/summary.txt
            kestrel/run/smoke/screenshots
          if-no-files-found: ignore

      - if: always()
        run: .github/scripts/kestrel/container.sh stop

  units:
    name: Service sandboxing
    needs: changes
    if: needs.changes.outputs.units == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    container:
      image: quay.io/fedora/fedora:45
    steps:
      - run: dnf install --assumeyes --setopt=install_weak_deps=False systemd git unzip

      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - run: bun .github/scripts/units/index.ts

  weblate:
    name: Weblate components
    needs: changes
    if: needs.changes.outputs.weblate == 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun packages/i18n/tools/weblate.ts

  compositor-identity:
    name: Compositor identity rules
    needs: changes
    if: needs.changes.outputs.compositor == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    container:
      image: quay.io/fedora/fedora:45
    steps:
      - run: dnf install --assumeyes --setopt=install_weak_deps=False git gcc glib2-devel python3

      - uses: actions/checkout@v7

      - run: python3 kestrel/compositor/patches.py identity

  dbus:
    name: D-Bus interfaces
    needs: changes
    if: needs.changes.outputs.dbus == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    container:
      image: quay.io/fedora/fedora:45
    steps:
      - run: dnf install --assumeyes --setopt=install_weak_deps=False git unzip cpio tar gzip bzip2 xz

      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - id: week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: target/dbus-references
          key: dbus-references-${{ hashFiles('.github/scripts/dbus/references.ts', 'kestrel/compositor/upstream.json') }}-${{ steps.week.outputs.week }}

      - run: bun .github/scripts/dbus/index.ts

  etc:
    name: State outside /etc
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun .github/scripts/etc/index.ts

  image-sources:
    name: Image part sources
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun os/image/parts/components/check.ts

  checks:
    name: Checks
    needs: [changes, rust, uefi, meet-windows, web, kestrel, units, weblate, compositor-identity, dbus, etc, image-sources]
    if: always()
    runs-on: ubuntu-slim
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
