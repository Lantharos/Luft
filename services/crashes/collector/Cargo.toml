[package]
name = "luft-crash-collector"
version = "0.1.0"
description = "Finds crashes of Luft's own programs in the journal and keeps finished, scrubbed reports for the people at the computer"
authors = ["Kristof"]
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
libc.workspace = true
luft-crash-report.workspace = true
luft-dbus = { workspace = true, features = ["service"] }
luft-dbus-macros.workspace = true
luft-identity.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "signal", "sync", "time"] }
zbus = { workspace = true, features = ["service", "tokio"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
