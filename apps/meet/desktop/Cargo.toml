[package]
name = "meet"
version = "0.1.0"
description = "Meet Luft: gets a Windows or Linux computer ready for Luft and starts it without a USB stick"
authors = ["Kristof"]
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
luft-i18n.workspace = true
luft-meet.workspace = true
luft-variant.workspace = true
minisign-verify.workspace = true
sabine.workspace = true
sabine-runtime.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
ureq.workspace = true

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
rfd.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
raw-window-handle.workspace = true
wmi.workspace = true
windows = { workspace = true, features = [
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Devices_Properties",
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_Security_Authentication_Identity",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_LibraryLoader",
  "Win32_System_Pipes",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_Shutdown",
  "Win32_System_SystemInformation",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_System_Time",
  "Win32_System_WindowsProgramming",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource.workspace = true

[lints]
workspace = true
