set default=0
set timeout_style=hidden
set timeout=0
set gfxpayload=keep

menuentry 'Luft' --class luft {
  linux /boot/vmlinuz root=luft-live:${medium} @ARGUMENTS@
  initrd /boot/initrd.img
}

menuentry 'Luft with basic graphics' --class luft {
  linux /boot/vmlinuz root=luft-live:${medium} @ARGUMENTS@ nomodeset
  initrd /boot/initrd.img
}

menuentry 'Firmware settings' {
  fwsetup
}
