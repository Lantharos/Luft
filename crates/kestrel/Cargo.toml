[package]
name = "kestrel"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
bitflags.workspace = true
clap.workspace = true
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
fps_ticker = { version = "1.0.0", optional = true }
glam.workspace = true
luft-config.workspace = true
luft-ipc.workspace = true
profiling = "1.0.18"
renderdoc = { version = "0.12.1", optional = true }
smithay.workspace = true
smithay-drm-extras = { workspace = true, optional = true }
thiserror.workspace = true
tracing = { workspace = true, features = ["max_level_trace", "release_max_level_debug"] }
tracing-subscriber.workspace = true
xcursor = { version = "0.3.11", optional = true }
xkbcommon = "0.9.0"

[features]
default = ["egl", "nested"]
egl = ["smithay/use_system_lib", "smithay/backend_egl"]
nested = ["smithay/backend_winit", "smithay/backend_drm"]
session-backend = [
    "smithay-drm-extras",
    "smithay/backend_libinput",
    "smithay/backend_udev",
    "smithay/backend_drm",
    "smithay/backend_gbm",
    "smithay/backend_vulkan",
    "smithay/backend_egl",
    "smithay/backend_session_libseat",
    "smithay/renderer_gl",
    "smithay/renderer_pixman",
    "smithay/renderer_multi",
    "xcursor",
]
debug = ["fps_ticker", "renderdoc"]
renderer_sync = []
