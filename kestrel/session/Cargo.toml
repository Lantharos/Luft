[package]
name = "kestrel-session-manager"
version = "0.1.0"
description = "Kestrel's session manager: org.gnome.SessionManager, presence and the freedesktop screen saver"
authors = ["Kristof"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
futures-util = { workspace = true, features = ["std"] }
gio.workspace = true
glib.workspace = true
luft-dbus.workspace = true
luft-identity.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "signal", "sync", "time"] }
zbus = { workspace = true, features = ["proxy", "service", "tokio"] }

[lints]
workspace = true
