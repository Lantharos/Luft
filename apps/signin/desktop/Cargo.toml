[package]
name = "signin"
version = "0.1.0"
description = "Signs in to Wi-Fi networks that ask for it first"
authors = ["Kristof"]
license = "MIT"
edition = "2024"
rust-version = "1.98"

[lib]
name = "signin_lib"

[dependencies]
futures-util = { version = "0.3.34", default-features = false }
luft-app = { path = "../../../packages/app" }
sabine = { git = "https://github.com/Lantharos/Sabine", tag = "v0.50" }
sabine-service = { git = "https://github.com/Lantharos/Sabine", tag = "v0.50" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
url = "2.5.8"
zbus = { version = "6.0.0", default-features = false, features = ["proxy", "tokio"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
