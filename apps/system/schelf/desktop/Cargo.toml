[package]
name = "schelf"
version = "0.1.0"
description = "Apps for Luft"
authors = ["Kristof"]
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "schelf_lib"

[dependencies]
dirs.workspace = true
gio.workspace = true
gio-unix = { workspace = true, features = ["v2_58"] }
libc.workspace = true
luft-app = { workspace = true, features = ["apps", "launch"] }
luft-dbus-macros.workspace = true
luft-sandbox.workspace = true
luft-software = { workspace = true, features = ["default"] }
sabine.workspace = true
schelf-core.workspace = true
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "signal", "sync"] }
zbus = { workspace = true, features = ["proxy", "service", "tokio"] }

[lints]
workspace = true
