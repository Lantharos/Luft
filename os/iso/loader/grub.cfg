set default=0
set timeout_style=hidden
set timeout=0
set gfxpayload=keep
search --no-floppy --set=root --label '@LABEL@'

menuentry 'Luft' --class luft {
  linux /boot/vmlinuz @ARGUMENTS@
  initrd /boot/initrd.img
}

menuentry 'Luft with basic graphics' --class luft {
  linux /boot/vmlinuz @ARGUMENTS@ nomodeset
  initrd /boot/initrd.img
}

menuentry 'Firmware settings' {
  fwsetup
}
