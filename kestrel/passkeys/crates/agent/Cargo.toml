[package]
name = "luft-passkeys"
description = "Keeps passkeys in Luft Keyring and answers browsers through the passkey relay"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ctap = { path = "../ctap" }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
libc = "0.2.189"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", default-features = false, features = ["rt", "macros", "time", "sync", "net", "io-util"] }
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }
zeroize = "1.9.0"
