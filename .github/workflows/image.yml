name: Image

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      rebuild:
        description: Build every part again instead of reusing the unchanged ones
        type: boolean
        default: false
      promote:
        description: Release this tested nightly as the stable version it leads to, such as 1.2-nightly.21
        type: string
        default: ""

concurrency:
  group: image-${{ inputs.promote && 'promote' || github.ref }}
  cancel-in-progress: ${{ !inputs.promote }}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/lantharos/luft
  CACHE: ghcr.io/lantharos/luft-cache
  LUFT_PARTS: ghcr.io/lantharos/luft-parts
  FEDORA: "45"
  MAJOR: "1"
  DOWNLOADS: https://get.luft.computer

jobs:
  promote:
    name: Promote
    if: inputs.promote
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      revision: ${{ steps.release.outputs.revision }}
      notes: ${{ steps.release.outputs.notes }}
      digest: ${{ steps.release.outputs.digest }}
      nvidia-digest: ${{ steps.release.outputs.nvidia-digest }}
      store-releases: ${{ steps.release.outputs.store-releases }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/actions
            .github/scripts
            os/image/files

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: imjasonh/setup-crane@v0.7

      - uses: ./.github/actions/registry

      - name: Release the tested nightly
        id: release
        env:
          NIGHTLY: ${{ inputs.promote }}
          GH_TOKEN: ${{ github.token }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          [[ "$NIGHTLY" =~ ^($MAJOR\.([0-9]+))-nightly\.[0-9]+$ ]] || { echo "$NIGHTLY doesn't name a Luft $MAJOR nightly." >&2; exit 1; }
          version="${BASH_REMATCH[1]}" release="${BASH_REMATCH[2]}"
          labels="$(skopeo inspect --retry-times 3 --format '{{json .Labels}}' "docker://$IMAGE:$NIGHTLY")"
          revision="$(jq -r '."org.opencontainers.image.revision" // empty' <<<"$labels")"
          [[ -n "$revision" ]] || { echo "$NIGHTLY doesn't say which commit it was built from." >&2; exit 1; }
          tagged="$(git ls-remote --tags --refs origin "refs/tags/v$version" | cut -f1)"
          if [[ -z "$tagged" ]]; then
            last="$(git ls-remote --tags --refs origin "refs/tags/v$MAJOR.*" | sed -nE "s|.*refs/tags/v$MAJOR\.([0-9]+)$|\1|p" | sort -n | tail -n 1)"
            (( release == ${last:--1} + 1 )) || { echo "$NIGHTLY leads to $version, but Luft $MAJOR.$(( ${last:--1} + 1 )) is next." >&2; exit 1; }
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/v$version" -f "sha=$revision" > /dev/null
          elif [[ "$tagged" != "$revision" ]]; then
            echo "v$version is already out, from $tagged." >&2
            exit 1
          fi
          previous="" since=""
          if ((release > 1)); then
            previous="$MAJOR.$((release - 1))"
            since="$(curl -sf "$DOWNLOADS/$MAJOR/notes/$previous.json" | jq -r .nightly)"
          fi
          nightly="$NIGHTLY"
          while [[ -n "$nightly" && "$nightly" != "$since" ]]; do
            entry="$(curl -sf "$DOWNLOADS/nightly/notes/$nightly.json")" || break
            jq -c .notes <<<"$entry"
            nightly="$(jq -r '.previous // empty' <<<"$entry")"
          done > "$RUNNER_TEMP/nightlies.jsonl"
          notes="$(bun .github/scripts/changelog/index.ts merge < "$RUNNER_TEMP/nightlies.jsonl")"
          key="$(mktemp -d)"
          trap 'rm -rf "$key"' EXIT
          printf '%s\n' "$COSIGN_PRIVATE_KEY" > "$key/private"
          printf '%s' "$COSIGN_PASSWORD" > "$key/password"
          sudo install -Dm644 -t /usr/share/pki/containers os/image/files/usr/share/pki/containers/luft.pub
          install -Dm644 -t ~/.config/containers/registries.d os/image/files/etc/containers/registries.d/luft.yaml
          for suffix in "" -nvidia; do
            stable="$IMAGE:$version$suffix"
            digest="$(skopeo inspect --retry-times 3 --format '{{.Digest}}' "docker://$IMAGE:$NIGHTLY$suffix")"
            skopeo copy --retry-times 3 --preserve-digests --policy os/image/files/etc/containers/policy.json \
              "docker://$IMAGE@$digest" "docker://$stable"
            crane config "$stable" |
              jq -c --arg version "$version" --arg notes "$notes" \
                '.config.Labels += {"org.opencontainers.image.version": $version, "com.lantharos.release-notes": $notes}' |
              crane edit config "$stable" > /dev/null
            crane manifest "$stable" |
              jq -c --arg version "$version" '.annotations += {"org.opencontainers.image.version": $version}' |
              crane edit manifest "$stable" > /dev/null
            digest="$(skopeo inspect --retry-times 3 --format '{{.Digest}}' "docker://$stable")"
            skopeo copy --retry-times 3 --preserve-digests --sign-by-sigstore-private-key "$key/private" \
              --sign-passphrase-file "$key/password" "docker://$IMAGE@$digest" "docker://$IMAGE:$MAJOR$suffix"
            echo "${suffix#-}${suffix:+-}digest=$digest" >> "$GITHUB_OUTPUT"
          done
          jq -n --arg version "$version" --arg previous "$previous" --arg nightly "$NIGHTLY" --argjson notes "$notes" \
            '{version: $version, previous: (if $previous == "" then null else $previous end), nightly: $nightly, notes: $notes}' |
            aws s3 cp - "s3://$R2_BUCKET/$MAJOR/notes/$version.json" --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
              --content-type application/json --only-show-errors
          {
            echo "version=$version"
            echo "revision=$revision"
            echo "notes=$notes"
            echo "store-releases=$(jq -r '."com.lantharos.store-releases" // empty' <<<"$labels")"
          } >> "$GITHUB_OUTPUT"

  stick:
    name: Stick
    needs: promote
    uses: ./.github/workflows/iso.yml
    with:
      channel: release
    secrets: inherit
    permissions:
      contents: read
      packages: read

  store-promote:
    name: Store releases to stable
    needs: promote
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Send this nightly's apps and extensions to stable
        env:
          STORE_RELEASES: ${{ needs.promote.outputs.store-releases }}
        run: bun .github/scripts/store/index.ts promote "$STORE_RELEASES"

  release:
    name: GitHub release
    needs: [promote, stick]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.promote.outputs.version }}
      REVISION: ${{ needs.promote.outputs.revision }}
      NOTES: ${{ needs.promote.outputs.notes }}
      DIGEST: ${{ needs.promote.outputs.digest }}
      NVIDIA_DIGEST: ${{ needs.promote.outputs.nvidia-digest }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Publish the release
        run: |
          bun .github/scripts/changelog/index.ts markdown <<<"$NOTES" > "$RUNNER_TEMP/CHANGES.md"
          cd "$RUNNER_TEMP"
          iso="luft-$VERSION.iso"
          for file in "$iso.sha256" "$iso.sha256.minisig"; do
            curl -sfLO "$DOWNLOADS/$MAJOR/$file"
          done
          key="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$REVISION/os/image/files/usr/share/pki/containers/luft.pub"
          cat CHANGES.md - > body.md <<EOF

          ## Downloads

          - [$iso]($DOWNLOADS/$MAJOR/$iso), with its [checksum]($DOWNLOADS/$MAJOR/$iso.sha256) and [signature]($DOWNLOADS/$MAJOR/$iso.sha256.minisig)
          - [Meet Luft](https://schelf.store/apps/com.lantharos.meet) for Windows and Linux

          ## Images

          | Image | Digest |
          | --- | --- |
          | \`$IMAGE:$MAJOR\` | \`$DIGEST\` |
          | \`$IMAGE:$MAJOR-nvidia\` | \`$NVIDIA_DIGEST\` |

          Both are signed with [Luft's key]($key):

          \`\`\`
          cosign verify --key luft.pub --insecure-ignore-tlog=true $IMAGE@$DIGEST
          \`\`\`
          EOF
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Luft $VERSION" \
            --notes-file body.md CHANGES.md "$iso.sha256" "$iso.sha256.minisig"

  plan:
    if: "!inputs.promote"
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      id-token: write
    outputs:
      skip: ${{ steps.version.outputs.skip }}
      version: ${{ steps.version.outputs.version }}
      tags: ${{ steps.version.outputs.tags }}
      notes: ${{ steps.version.outputs.notes }}
      base: ${{ steps.parts.outputs.base }}
      cef: ${{ steps.parts.outputs.cef }}
      store: ${{ steps.parts.outputs.store }}
      parts: ${{ steps.parts.outputs.parts }}
      signed: ${{ steps.parts.outputs.signed }}
      details: ${{ steps.parts.outputs.details }}
      sabine: ${{ steps.store.outputs.sabine }}
      apps: ${{ steps.store.outputs.apps }}
      extensions: ${{ steps.store.outputs.extensions }}
      publish: ${{ steps.store.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: ./.github/actions/registry

      - name: Apps and extensions that changed since their last release
        id: store
        run: bun .github/scripts/store/index.ts plan >> "$GITHUB_OUTPUT"

      - name: Version and release notes
        id: version
        env:
          PUBLISH: ${{ steps.store.outputs.publish }}
        run: |
          nightly="$(skopeo inspect --retry-times 3 --format '{{json .Labels}}' "docker://$IMAGE:$MAJOR-nightly")"
          built="$(jq -r '."org.opencontainers.image.revision" // empty' <<<"$nightly")"
          base="$(os/image/build.sh base)"
          cef="$(os/image/build.sh cef)"
          store="$(os/image/build.sh store)"
          {
            echo "LUFT_BASE=$base"
            echo "LUFT_CEF=$cef"
            echo "LUFT_STORE=$store"
          } >> "$GITHUB_ENV"
          if [[ "$GITHUB_EVENT_NAME" == schedule && "$built" == "$GITHUB_SHA" && "$PUBLISH" == "[]" &&
                "$base" == "$(jq -r '."org.opencontainers.image.base.name" // empty' <<<"$nightly")" &&
                "$cef" == "$(jq -r '."com.lantharos.cef" // empty' <<<"$nightly")" &&
                "$store" == "$(jq -r '."com.lantharos.store" // empty' <<<"$nightly")" ]] &&
            LUFT_BASE="$base" os/image/build.sh updates "$IMAGE:$MAJOR-nightly"; then
            echo "Nothing changed since the last nightly."
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last="$(git tag --list "v$MAJOR.*" | sed -nE "s/^v$MAJOR\.([0-9]+)$/\1/p" | sort -n | tail -n 1)"
          target="$MAJOR.$(( ${last:--1} + 1 ))"
          current="$(jq -r '."org.opencontainers.image.version" // empty' <<<"$nightly")"
          number=1
          [[ "$current" =~ ^"$target"-nightly\.([0-9]+)$ ]] && number=$(( BASH_REMATCH[1] + 1 ))
          version="$target-nightly.$number"
          tags=("$MAJOR-nightly" "$version")
          {
            echo "version=$version"
            echo "tags=${tags[*]}"
            echo "notes=$(bun .github/scripts/changelog/index.ts since "$built")"
          } >> "$GITHUB_OUTPUT"

      - name: Parts
        id: parts
        if: steps.version.outputs.skip != '1'
        env:
          LUFT_SECUREBOOT_CERT: os/image/keys/luft-secureboot.crt
          LUFT_REBUILD: ${{ inputs.rebuild && '1' || '' }}
        run: |
          os/image/build.sh plan luft-nvidia | tee "$RUNNER_TEMP/parts.tsv"
          rows() {
            jq --raw-input --slurp --compact-output '[
              split("\n")[] | select(length > 0) | split("\t") | select(.[2] == "missing") |
              {name: .[0], key: (.[1] | sub(".*-"; "")), family: (.[0] | sub("-.*"; "")), signing: .[3]}
            ]' "$RUNNER_TEMP/parts.tsv"
          }
          missing="$(rows)"
          {
            echo "base=$LUFT_BASE"
            echo "cef=$LUFT_CEF"
            echo "store=$LUFT_STORE"
            echo "parts=$(jq -c '[.[] | select(.signing == "unsigned" and .name != "store") | .name]' <<<"$missing")"
            echo "signed=$(jq -c '[.[] | select(.signing == "signed") | .name]' <<<"$missing")"
            echo "details=$(jq -c 'map({(.name): {key, family}}) | add // {}' <<<"$missing")"
          } >> "$GITHUB_OUTPUT"

  store-apps:
    name: App (${{ matrix.app.name }})
    needs: plan
    if: needs.plan.outputs.apps != '' && needs.plan.outputs.apps != '[]'
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: Lantharos/Sabine/.github/workflows/release-app.yml@0bd7346ef3b1d098caa383dc2ceb7addeb63d909
    with:
      sabine_version: ${{ needs.plan.outputs.sabine }}
      app: ${{ matrix.app.folder }}
      platforms: ${{ matrix.app.platforms }}
      version: ${{ matrix.app.version }}
      artifact: app-${{ matrix.app.name }}
      linux_packages: libglib2.0-dev libseccomp-dev libclang-dev libpipewire-0.3-dev libspa-0.2-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      # Building the MSI package accepts the WiX 7 licence: https://docs.firegiant.com/wix/osmf/
      accept_wix_eula: true
    secrets: inherit

  store-extensions:
    name: Extension (${{ matrix.extension.name }} on ${{ matrix.extension.runner }})
    needs: plan
    if: needs.plan.outputs.extensions != '' && needs.plan.outputs.extensions != '[]'
    strategy:
      fail-fast: false
      matrix:
        extension: ${{ fromJSON(needs.plan.outputs.extensions) }}
    runs-on: ${{ matrix.extension.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Install Rust for a native helper
        if: hashFiles(format('{0}/helper/Cargo.toml', matrix.extension.folder)) != ''
        run: rustup update stable && rustup default stable

      - name: Use the version being released
        run: sed -i 's/^version = ".*"$/version = "${{ matrix.extension.version }}"/' "${{ matrix.extension.folder }}/extension.toml"

      - run: extensions/pack.sh "${{ matrix.extension.folder }}" dist

      - uses: actions/upload-artifact@v7
        with:
          name: extension-${{ matrix.extension.name }}-${{ matrix.extension.runner }}
          path: dist
          if-no-files-found: error

  store-publish:
    name: Publish (${{ matrix.item.name }} ${{ matrix.item.version }})
    needs: [plan, store-apps, store-extensions]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.publish != '[]' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        item: ${{ fromJSON(needs.plan.outputs.publish) }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: ${{ matrix.item.kind }}-${{ matrix.item.name }}-*
          path: dist
          merge-multiple: true

      - uses: Lantharos/Store/publish@v1
        with:
          files: dist/**
          schelf-toml: ${{ matrix.item.folder }}/schelf.toml
          version: ${{ matrix.item.version }}
          channel: nightly
          notes: ${{ matrix.item.notes }}

  store-part:
    name: Store part
    needs: [plan, store-publish]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.skip != '1' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 75
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      store: ${{ steps.releases.outputs.store }}
      releases: ${{ steps.releases.outputs.releases }}
    env:
      LUFT_BASE: ${{ needs.plan.outputs.base }}
      LUFT_CEF: ${{ needs.plan.outputs.cef }}
      LUFT_SECUREBOOT_CERT: os/image/keys/luft-secureboot.crt
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: ./.github/actions/registry

      - name: Wait for tonight's releases to pass their checks
        if: needs.plan.outputs.publish != '[]'
        env:
          PUBLISH: ${{ needs.plan.outputs.publish }}
        run: bun .github/scripts/store/index.ts settle "$PUBLISH"

      - name: Releases the image ships with
        id: releases
        run: |
          store="$(os/image/build.sh store)"
          echo "store=$store" >> "$GITHUB_OUTPUT"
          bun .github/scripts/store/index.ts catalog >> "$GITHUB_OUTPUT"
          echo "LUFT_STORE=$store" >> "$GITHUB_ENV"

      - name: Build the part
        run: |
          state="$(os/image/build.sh plan luft | awk -F '\t' '$1 == "store" {print $3}')"
          [[ "$state" != missing ]] || os/image/build.sh part store --cache-from "$CACHE" --cache-to "$CACHE"

  parts:
    name: Part
    needs: plan
    if: needs.plan.outputs.skip != '1' && needs.plan.outputs.parts != '[]'
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.plan.outputs.parts) }}
    env:
      LUFT_BASE: ${{ needs.plan.outputs.base }}
      LUFT_CEF: ${{ needs.plan.outputs.cef }}
      LUFT_STORE: ${{ needs.plan.outputs.store }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/build-part
        with:
          part: ${{ matrix.part }}
          key: ${{ fromJSON(needs.plan.outputs.details)[matrix.part].key }}
          family: ${{ fromJSON(needs.plan.outputs.details)[matrix.part].family }}

  signed-parts:
    name: Signed part
    needs: plan
    if: needs.plan.outputs.skip != '1' && needs.plan.outputs.signed != '[]'
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.plan.outputs.signed) }}
    env:
      LUFT_BASE: ${{ needs.plan.outputs.base }}
      LUFT_CEF: ${{ needs.plan.outputs.cef }}
      LUFT_STORE: ${{ needs.plan.outputs.store }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/signing-keys
        with:
          key: ${{ secrets.LUFT_SECUREBOOT_KEY }}
          certificate: ${{ secrets.LUFT_SECUREBOOT_CERT }}

      - uses: ./.github/actions/build-part
        with:
          part: ${{ matrix.part }}
          key: ${{ fromJSON(needs.plan.outputs.details)[matrix.part].key }}
          family: ${{ fromJSON(needs.plan.outputs.details)[matrix.part].family }}

      - name: Forget the signing keys
        if: always()
        run: rm -rf "$LUFT_KEYS"

  image:
    name: Images
    needs: [plan, parts, signed-parts, store-part]
    if: >-
      always() && needs.plan.result == 'success' && needs.plan.outputs.skip != '1' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    env:
      LUFT_BASE: ${{ needs.plan.outputs.base }}
      LUFT_CEF: ${{ needs.plan.outputs.cef }}
      LUFT_STORE: ${{ needs.store-part.outputs.store }}
      STORE_RELEASES: ${{ needs.store-part.outputs.releases }}
      VERSION: ${{ needs.plan.outputs.version }}
      RELEASE_NOTES: ${{ needs.plan.outputs.notes }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/make-room

      - uses: ./.github/actions/registry

      - name: Build folders
        run: |
          {
            echo "LUFT_IMAGE_STATE=$RUNNER_TEMP/image"
            echo "TMPDIR=$RUNNER_TEMP"
          } >> "$GITHUB_ENV"

      - uses: ./.github/actions/signing-keys
        with:
          key: ${{ secrets.LUFT_SECUREBOOT_KEY }}
          certificate: ${{ secrets.LUFT_SECUREBOOT_CERT }}
          pcr-key: ${{ secrets.LUFT_PCR_KEY }}

      - name: Build both images
        run: |
          os/image/build.sh luft luft-nvidia --cache-from "$CACHE" --cache-to "$CACHE" \
            --build-arg "VERSION=$VERSION" --build-arg "REVISION=$GITHUB_SHA" --build-arg "RELEASE_NOTES=$RELEASE_NOTES" \
            --build-arg "STORE_RELEASES=$STORE_RELEASES"

      - name: Forget the signing keys
        if: always()
        run: rm -rf "$LUFT_KEYS"

      - name: Push and sign
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          key="$(mktemp -d)"
          trap 'rm -rf "$key"' EXIT
          printf '%s\n' "$COSIGN_PRIVATE_KEY" > "$key/private"
          printf '%s' "$COSIGN_PASSWORD" > "$key/password"
          install -Dm644 -t ~/.config/containers/registries.d os/image/files/etc/containers/registries.d/luft.yaml
          for suffix in "" -nvidia; do
            podman push --sign-by-sigstore-private-key "$key/private" --sign-passphrase-file "$key/password" \
              "localhost/luft:$FEDORA$suffix" "$IMAGE:$VERSION$suffix"
          done

  gate:
    name: Boot test
    needs: [plan, image]
    if: always() && needs.image.result == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 75
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/make-room

      - uses: ./.github/actions/registry

      - name: QEMU with KVM
        run: |
          echo "LUFT_VM=$RUNNER_TEMP/vm" >> "$GITHUB_ENV"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update --quiet
          sudo apt-get install --yes --quiet --no-install-recommends qemu-system-x86 qemu-utils ovmf swtpm
          sudo apparmor_parser --remove /etc/apparmor.d/usr.bin.swtpm

      - name: Install the new nightly
        run: |
          password="$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          echo "VM_PASSWORD=$password" >> "$GITHUB_ENV"
          podman pull --quiet "$IMAGE:$VERSION" > /dev/null
          VM_PASSWORD="$password" VM_FOLLOWS="$IMAGE:$MAJOR-nightly" os/vm/disk.sh "$IMAGE:$VERSION"

      - name: Start it with Secure Boot and sign in
        run: os/vm/check.py --out "$RUNNER_TEMP/boot-test" session

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: boot-test
          path: |
            ${{ runner.temp }}/boot-test
            ${{ runner.temp }}/vm/install.log
          if-no-files-found: ignore
          retention-days: 14

  publish:
    needs: [plan, image, gate]
    if: always() && needs.gate.result == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAGS: ${{ needs.plan.outputs.tags }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions

      - uses: ./.github/actions/registry

      - name: Publish the release notes
        env:
          NOTES: ${{ needs.plan.outputs.notes }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          previous="$(skopeo inspect --retry-times 3 --format '{{index .Labels "org.opencontainers.image.version"}}' "docker://$IMAGE:$MAJOR-nightly")"
          jq -n --arg version "$VERSION" --arg previous "$previous" --argjson notes "$NOTES" \
            '{version: $version, previous: $previous, notes: $notes}' |
            aws s3 cp - "s3://$R2_BUCKET/nightly/notes/$VERSION.json" --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
              --content-type application/json --only-show-errors

      - name: Tag both images
        run: |
          for tag in $TAGS; do
            [[ "$tag" != "$VERSION" ]] || continue
            for suffix in "" -nvidia; do
              skopeo copy --retry-times 3 --preserve-digests "docker://$IMAGE:$VERSION$suffix" "docker://$IMAGE:$tag$suffix"
            done
          done

  nightly-stick:
    name: Nightly stick
    needs: publish
    if: always() && needs.publish.result == 'success'
    uses: ./.github/workflows/iso.yml
    with:
      channel: nightly
    secrets: inherit
    permissions:
      contents: read
      packages: read
