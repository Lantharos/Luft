[package]
name = "luft-updater"
version = "0.1.0"
description = "Checks, downloads and rolls back Luft's system image with bootc for Settings and the shell"
authors = ["Kristof"]
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
libc.workspace = true
luft-dbus.workspace = true
luft-dbus-macros.workspace = true
luft-identity.workspace = true
luft-variant.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
zbus = { workspace = true, features = ["service", "tokio"] }

[lints]
workspace = true
