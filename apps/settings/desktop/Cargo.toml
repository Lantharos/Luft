[package]
name = "settings"
version = "0.1.0"
description = "Settings for Luft"
authors = ["Kristof"]
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "settings_lib"

[dependencies]
bzip2.workspace = true
deunicode.workspace = true
dirs.workspace = true
flate2 = { workspace = true, features = ["zlib-rs"] }
futures-util.workspace = true
gio.workspace = true
gio-unix.workspace = true
gstreamer.workspace = true
image = { workspace = true, features = ["jpeg", "webp"] }
inotify = { workspace = true, features = ["default"] }
jxl-oxide.workspace = true
libc.workspace = true
liblzma.workspace = true
libpulse-binding.workspace = true
luft-accounts = { workspace = true, features = ["default"] }
luft-app = { workspace = true, features = ["apps", "fonts", "ibus", "launch", "recovery", "watch"] }
luft-disks.workspace = true
luft-fingerprint.workspace = true
luft-i18n.workspace = true
luft-network.workspace = true
luft-software = { workspace = true, features = ["default"] }
luft-speech = { workspace = true, features = ["default"] }
luft-trust.workspace = true
roxmltree.workspace = true
sabine.workspace = true
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
tar.workspace = true
tokio = { workspace = true, features = ["net", "rt", "sync", "time"] }
ureq.workspace = true
zbus = { workspace = true, features = ["proxy", "service", "tokio"] }
zip.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
