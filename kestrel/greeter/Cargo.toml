[package]
name = "kestrel-greeter-service"
version = "0.1.0"
edition = "2024"

[dependencies]
fast_image_resize = { version = "6.1.0", features = ["image"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "tiff", "bmp", "gif"] }
jpeg-encoder = { version = "0.7.1", features = ["simd"] }
jxl-oxide = { version = "0.12.6", features = ["image"] }
nix = { version = "0.31.3", features = ["user"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", default-features = false, features = ["rt", "macros", "time", "sync"] }
toml_edit = "0.25.15"
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
