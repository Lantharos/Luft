[package]
name = "luft-remote-login"
description = "Lets the accounts people choose sign in to the computer over SSH, with keys"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
base64.workspace = true
luft-dbus.workspace = true
luft-dbus-macros.workspace = true
nix = { workspace = true, features = ["user"] }
rustix = { workspace = true, features = ["fs", "thread"] }
sha2.workspace = true
tokio = { workspace = true, features = ["macros", "process", "rt", "sync"] }
zbus = { workspace = true, features = ["proxy", "service", "tokio"] }

[lints]
workspace = true
