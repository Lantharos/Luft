[package]
name = "keys"
version = "0.1.0"
description = "Keyboard layouts and input methods for Luft"
authors = ["Kristof"]
license = "MIT"
edition = "2024"
rust-version = "1.93"

[lib]
name = "keys_lib"

[dependencies]
dirs = "7.0.0"
futures-util = { version = "0.3.34", default-features = false }
gio = "0.22.10"
inotify = "0.11.5"
luft-app = { path = "../../../packages/app", features = ["ibus"] }
roxmltree = "0.21.1"
sabine = { git = "https://github.com/Lantharos/Sabine", tag = "v0.33" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", default-features = false, features = ["rt", "macros", "time"] }
toml = "1.1.6"
xkbcommon = { version = "0.9.0", default-features = false }
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }
