[package]
name = "sushiboot"
description = "A minimal UEFI boot menu that keeps the firmware logo on screen"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "sushiboot"
path = "src/main.rs"

[dependencies]
libm = "0.2.16"
log = "0.4.34"
sushi-scene.workspace = true
uefi = { version = "0.41.0", features = ["alloc", "global_allocator", "logger", "panic_handler"] }

[lints]
workspace = true
