[package]
name = "ctap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
ciborium = "0.2.2"
aes = "0.9.3"
cbc = { version = "0.2.1", features = ["alloc"] }
getrandom = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
p256 = { version = "0.14.0", features = ["ecdh", "getrandom"] }
sha2 = "0.11.0"
zeroize = { version = "1.9.0", features = ["derive"] }

[dev-dependencies]
pollster = "1.0.1"
