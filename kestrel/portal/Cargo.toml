[package]
name = "kestrel-portal"
version = "0.1.0"
description = "The parts of Kestrel's desktop portal that need no compositor: email, printing, accounts, app choosers, launchers, USB devices, wallpapers and lockdown"
authors = ["Kristof"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
futures-util.workspace = true
gio.workspace = true
gio-unix.workspace = true
glib.workspace = true
luft-dbus-macros.workspace = true
luft-i18n.workspace = true
rustix = { workspace = true, features = ["fs", "rand"] }
sha2.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "signal", "sync", "time"] }
zbus = { workspace = true, features = ["proxy", "service", "tokio"] }

[lints]
workspace = true
