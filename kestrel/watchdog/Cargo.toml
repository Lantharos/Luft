[package]
name = "kestrel-watchdog"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
jiff = "0.2.37"
rustix = { version = "1.1.5", features = ["fs", "time"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", default-features = false, features = ["rt", "macros", "time", "sync", "process", "signal"] }
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
