[package]
name = "setup"
version = "0.1.0"
description = "Installs Luft and sets up a new computer"
authors = ["Kristof"]
license = "MIT"
edition = "2024"
rust-version = "1.98"

[lib]
name = "setup_lib"

[dependencies]
gio = "0.22.10"
gio-unix = "0.22.8"
luft-app = { path = "../../../packages/app", features = ["recovery"] }
luft-fingerprint = { path = "../../../packages/fingerprint" }
luft-network = { path = "../../../packages/network" }
roxmltree = "0.21.1"
sabine = { git = "https://github.com/Lantharos/Sabine", tag = "v0.38" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = { version = "3.4.2", features = ["platform-verifier"] }
zbus = { version = "5.19.0", default-features = false, features = ["blocking-api", "tokio"] }
