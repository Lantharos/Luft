[package]
name = "luft-keyring"
description = "Luft's secret store"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aes = "0.9.3"
base64 = "0.23.1"
cbc = { version = "0.2.1", features = ["alloc"] }
crypto-bigint = "0.7.5"
ed25519-dalek = "3.0.0"
futures-util = { version = "0.3.34", default-features = false }
getrandom.workspace = true
hkdf = "0.13.0"
hmac = "0.13.0"
libc = "0.2.189"
md-5 = "0.11.0"
pbkdf2 = { version = "0.13.0", default-features = false, features = ["hmac"] }
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa", "std"] }
postcard.workspace = true
rustix.workspace = true
serde.workspace = true
serde_json = "1.0.151"
luft-keyring-vault.workspace = true
luft-keyring-wire = { workspace = true, features = ["tokio"] }
sha2 = "0.11.0"
tokio.workspace = true
zbus.workspace = true
zeroize.workspace = true
zgvariant = "1.2.0"
