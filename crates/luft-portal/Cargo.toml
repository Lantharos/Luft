[package]
name = "luft-portal"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "luft-portal"
path = "src/main.rs"

[dependencies]
ashpd = { version = "0.13.13", features = ["backend", "screencast", "screenshot", "settings"] }
async-trait = "0.1.89"
enumflags2 = "0.7.12"
image = { version = "0.25.10", default-features = false, features = ["png"] }
memmap2 = "0.9.11"
pipewire = "0.10.0"
rustix = { version = "1.1.4", features = ["event"] }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true
url = "2.5.8"
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
