name: Image

on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      rebuild:
        description: Build every part again instead of reusing the unchanged ones
        type: boolean
        default: false

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/lantharos/luft
  CACHE: ghcr.io/lantharos/luft-cache
  LUFT_PARTS: ghcr.io/lantharos/luft-parts
  FEDORA: "45"

jobs:
  plan:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    outputs:
      skip: ${{ steps.version.outputs.skip }}
      version: ${{ steps.version.outputs.version }}
      tags: ${{ steps.version.outputs.tags }}
      reference: ${{ steps.version.outputs.reference }}
      notes: ${{ steps.version.outputs.notes }}
      base: ${{ steps.parts.outputs.base }}
      parts: ${{ steps.parts.outputs.parts }}
      signed: ${{ steps.parts.outputs.signed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 50

      - uses: oven-sh/setup-bun@v2

      - name: Sign in to the registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Version and release notes
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME#v}"
            tags=("$FEDORA" "$version")
            since="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-parse HEAD~10)"
          else
            if [[ "$GITHUB_EVENT_NAME" == schedule && -z "$(git log --since=24.hours --format=%H -1)" ]]; then
              echo "No changes since the last nightly build."
              echo "skip=1" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            version="$FEDORA.$(date -u +%Y%m%d).${{ github.run_number }}-nightly"
            tags=("$FEDORA-nightly" "$version")
            since="$(git rev-list -1 --before=24.hours HEAD)"
          fi
          delimiter="notes-$(openssl rand -hex 8)"
          {
            echo "version=$version"
            echo "tags=${tags[*]}"
            echo "reference=$IMAGE:${tags[0]}"
            echo "notes<<$delimiter"
            git log --no-merges --format='- %s' "$since..HEAD"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Parts
        id: parts
        if: steps.version.outputs.skip != '1'
        env:
          LUFT_SECUREBOOT_CERT: os/image/keys/luft-secureboot.crt
          LUFT_REBUILD: ${{ (github.ref_type == 'tag' || inputs.rebuild) && '1' || '' }}
        run: |
          base="$(os/image/build.sh base)"
          LUFT_BASE="$base" os/image/build.sh plan luft-nvidia | tee "$RUNNER_TEMP/parts.tsv"
          missing() {
            jq --raw-input --slurp --compact-output --arg signing "$1" '[
              split("\n")[] | select(length > 0) | split("\t") | select(.[2] == "missing" and .[3] == $signing) |
              {name: .[0], key: (.[1] | sub(".*-"; "")), family: (.[0] | sub("-.*"; ""))}
            ]' "$RUNNER_TEMP/parts.tsv"
          }
          {
            echo "base=$base"
            echo "parts=$(missing unsigned)"
            echo "signed=$(missing signed)"
          } >> "$GITHUB_OUTPUT"

  parts:
    name: Part ${{ matrix.part.name }}
    needs: plan
    if: needs.plan.outputs.skip != '1' && needs.plan.outputs.parts != '[]'
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.plan.outputs.parts) }}
    env:
      LUFT_BASE: ${{ needs.plan.outputs.base }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/build-part
        with:
          part: ${{ matrix.part.name }}
          key: ${{ matrix.part.key }}
          family: ${{ matrix.part.family }}

  signed-parts:
    name: Part ${{ matrix.part.name }}
    needs: plan
    if: needs.plan.outputs.skip != '1' && needs.plan.outputs.signed != '[]'
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.plan.outputs.signed) }}
    env:
      LUFT_BASE: ${{ needs.plan.outputs.base }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/signing-keys
        with:
          key: ${{ secrets.LUFT_SECUREBOOT_KEY }}
          certificate: ${{ secrets.LUFT_SECUREBOOT_CERT }}

      - uses: ./.github/actions/build-part
        with:
          part: ${{ matrix.part.name }}
          key: ${{ matrix.part.key }}
          family: ${{ matrix.part.family }}

      - name: Forget the signing keys
        if: always()
        run: rm -rf "$LUFT_KEYS"

  image:
    needs: [plan, parts, signed-parts]
    if: >-
      always() && needs.plan.result == 'success' && needs.plan.outputs.skip != '1' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    env:
      LUFT_BASE: ${{ needs.plan.outputs.base }}
      VERSION: ${{ needs.plan.outputs.version }}
      TAGS: ${{ needs.plan.outputs.tags }}
      REFERENCE: ${{ needs.plan.outputs.reference }}
      RELEASE_NOTES: ${{ needs.plan.outputs.notes }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Sign in to the registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io --username "${{ github.actor }}" --password-stdin
          {
            echo "LUFT_IMAGE_STATE=$RUNNER_TEMP/image"
            echo "TMPDIR=$RUNNER_TEMP"
          } >> "$GITHUB_ENV"

      - uses: ./.github/actions/signing-keys
        with:
          key: ${{ secrets.LUFT_SECUREBOOT_KEY }}
          certificate: ${{ secrets.LUFT_SECUREBOOT_CERT }}
          pcr-key: ${{ secrets.LUFT_PCR_KEY }}

      - name: Build luft
        run: |
          os/image/build.sh luft --cache-from "$CACHE" --cache-to "$CACHE" \
            --build-arg "VERSION=$VERSION" --build-arg "IMAGE_REFERENCE=$REFERENCE" \
            --build-arg "RELEASE_NOTES=$RELEASE_NOTES"

      - name: Build luft-nvidia
        run: |
          os/image/build.sh luft-nvidia --cache-from "$CACHE" --cache-to "$CACHE" \
            --build-arg "VERSION=$VERSION" --build-arg "IMAGE_REFERENCE=$REFERENCE" \
            --build-arg "RELEASE_NOTES=$RELEASE_NOTES"

      - name: Forget the signing keys
        if: always()
        run: rm -rf "$LUFT_KEYS"

      - name: Push
        run: |
          for tag in $TAGS; do
            podman push "localhost/luft:$FEDORA" "$IMAGE:$tag"
            podman push "localhost/luft:$FEDORA-nvidia" "$IMAGE:$tag-nvidia"
          done
