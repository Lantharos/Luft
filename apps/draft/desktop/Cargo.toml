[package]
name = "draft"
version = "0.1.0"
description = "A text and code editor for Luft"
authors = ["Kristof"]
license = "GPL-3.0-or-later"
edition = "2024"
rust-version = "1.98"

[lib]
name = "draft_lib"

[dependencies]
chardetng = "1.0.0"
dirs = "7.0.0"
encoding_rs = "0.8.42"
ignore = "0.4.33"
luft-app = { path = "../../../packages/app", features = ["settings", "watch"] }
parking_lot = "0.12.5"
sabine = { git = "https://github.com/Lantharos/Sabine", tag = "v0.51" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
zbus = { version = "6.0.0", default-features = false, features = ["proxy", "tokio"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
