name: Make room
description: Removes the runner's preinstalled toolchains and images in the background to free disk space for the build.

runs:
  using: composite
  steps:
    - name: Make room
      shell: bash
      run: |
        nohup sudo sh -c 'rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost; docker image prune --all --force' >/dev/null 2>&1 &
