name: Checks

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  changes:
    name: Affected checks
    runs-on: ubuntu-slim
    timeout-minutes: 10
    outputs:
      rust: ${{ steps.affected.outputs.rust }}
      uefi: ${{ steps.affected.outputs.uefi }}
      meet-windows: ${{ steps.affected.outputs.meet-windows }}
      web: ${{ steps.affected.outputs.web }}
      units: ${{ steps.affected.outputs.units }}
      weblate: ${{ steps.affected.outputs.weblate }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - id: affected
        run: bun .github/scripts/affected/index.ts

  rust:
    name: Rust ${{ matrix.check }} ${{ matrix.group.name }}
    needs: changes
    if: needs.changes.outputs.rust != '[]'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    container:
      image: ghcr.io/lantharos/luft-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        check: [clippy, test]
        group: ${{ fromJSON(needs.changes.outputs.rust) }}
    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.check }}-${{ matrix.group.name }}
          cache-bin: false

      - if: matrix.check == 'clippy'
        run: cargo clippy --locked --all-targets ${{ matrix.group.packages }} -- -D warnings

      - if: matrix.check == 'test'
        run: cargo test --locked ${{ matrix.group.packages }}

  uefi:
    name: Rust UEFI
    needs: changes
    if: needs.changes.outputs.uefi != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    container:
      image: ghcr.io/lantharos/luft-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: uefi
          cache-bin: false

      - run: cargo clippy --locked ${{ needs.changes.outputs.uefi }} --target x86_64-unknown-uefi -- -D warnings

  meet-windows:
    name: Rust Meet Luft for Windows
    needs: changes
    if: needs.changes.outputs.meet-windows == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    container:
      image: ghcr.io/lantharos/luft-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows
          cache-bin: false

      - run: cargo clippy --locked -p meet --all-targets --target x86_64-pc-windows-gnu -- -D warnings

  web:
    name: TypeScript ${{ matrix.target }}
    needs: changes
    if: needs.changes.outputs.web != '[]'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.changes.outputs.web) }}
    defaults:
      run:
        working-directory: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-

      - run: bun install --frozen-lockfile
        working-directory: .

      - run: bun run check

  units:
    name: Service sandboxing
    needs: changes
    if: needs.changes.outputs.units == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    container:
      image: quay.io/fedora/fedora:45
    steps:
      - run: dnf install --assumeyes --setopt=install_weak_deps=False systemd git unzip

      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - run: bun .github/scripts/units/index.ts

  weblate:
    name: Weblate components
    needs: changes
    if: needs.changes.outputs.weblate == 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun packages/i18n/tools/weblate.ts

  checks:
    name: Checks
    needs: [changes, rust, uefi, meet-windows, web, units, weblate]
    if: always()
    runs-on: ubuntu-slim
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
