name: Sign in to the registry
description: Signs podman and cosign in to GitHub's container registry with the workflow's token.

runs:
  using: composite
  steps:
    - name: Sign in to the registry
      shell: bash
      env:
        TOKEN: ${{ github.token }}
      run: |
        export DOCKER_CONFIG="$RUNNER_TEMP/registry"
        export REGISTRY_AUTH_FILE="$DOCKER_CONFIG/config.json"
        mkdir -p "$DOCKER_CONFIG"
        {
          echo "DOCKER_CONFIG=$DOCKER_CONFIG"
          echo "REGISTRY_AUTH_FILE=$REGISTRY_AUTH_FILE"
        } >> "$GITHUB_ENV"
        podman login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<<"$TOKEN"
