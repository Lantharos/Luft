[package]
name = "meet"
version = "0.1.0"
description = "Meet Luft: gets a Windows or Linux computer ready for Luft and starts it without a USB stick"
authors = ["Kristof"]
license = "MIT"
edition = "2024"
rust-version = "1.98"

[dependencies]
luft-meet = { path = "../../../packages/meet" }
luft-variant = { path = "../../../packages/variant" }
minisign-verify = "0.3.0"
sabine = { git = "https://github.com/Lantharos/Sabine", tag = "v0.50" }
sabine-runtime = { git = "https://github.com/Lantharos/Sabine", tag = "v0.50" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
ureq = { version = "3.4.2", features = ["platform-verifier"] }

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
rfd = "0.17.2"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.190"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6.2"
wmi = { version = "0.18.4", default-features = false }
windows = { version = "0.62.2", features = [
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Devices_Properties",
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_Security_Authentication_Identity",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_LibraryLoader",
  "Win32_System_Pipes",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_Shutdown",
  "Win32_System_SystemInformation",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_System_Time",
  "Win32_System_WindowsProgramming",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true

[build-dependencies]
embed-resource = "3.0.12"
