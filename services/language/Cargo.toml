[package]
name = "luft-language-service"
version = "0.1.0"
description = "A language model on this computer, writing notes of recorded classes for the apps that ask"
authors = ["Kristof"]
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "luft-language"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
luft-dbus = { workspace = true, features = ["service"] }
luft-dbus-macros.workspace = true
luft-language.workspace = true
luft-models.workspace = true
llama-cpp-2 = { workspace = true, features = ["common", "mtmd", "vulkan"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
zbus = { workspace = true, features = ["service", "tokio"] }

[lints]
workspace = true
