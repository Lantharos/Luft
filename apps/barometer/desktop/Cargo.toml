[package]
name = "barometer"
version = "0.1.0"
description = "System monitor for Luft"
authors = ["Kristof"]
license = "MIT"
edition = "2024"
rust-version = "1.98"

[lib]
name = "barometer_lib"

[dependencies]
dirs = "7.0.0"
libc = "0.2.190"
luft-app = { path = "../../../packages/app", features = ["apps"] }
nvml-wrapper = "0.13.0"
parking_lot = "0.12.5"
sabine = { git = "https://github.com/Lantharos/Sabine", tag = "v0.48" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
