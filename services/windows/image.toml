part = "services"

[programs]
"/usr/libexec/" = ["neighbor"]

[files]
"/usr/share/dbus-1/system.d/" = ["data/com.lantharos.Windows1.conf"]
"/usr/share/dbus-1/system-services/" = ["data/com.lantharos.Windows1.service"]
"/usr/lib/systemd/system/" = ["data/neighbor.service", "data/neighbor-boot.service"]
"/usr/lib/systemd/user/" = ["data/neighbor-notice.service"]
"/usr/share/polkit-1/actions/" = ["data/com.lantharos.windows.policy"]

[enable]
system = ["neighbor-boot.service"]
user = ["neighbor-notice.service"]
