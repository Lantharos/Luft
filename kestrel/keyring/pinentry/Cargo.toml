[package]
name = "luft-pinentry"
description = "Asks for GnuPG passphrases and PINs through Kestrel"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
futures-util.workspace = true
rustix = { workspace = true, features = ["fs", "mm", "net", "pipe", "process"] }
serde.workspace = true
tokio = { workspace = true, features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "rt",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
zbus = { workspace = true, features = ["proxy", "service", "tokio"] }
zeroize = { workspace = true, features = ["derive", "serde"] }

[lints]
workspace = true
