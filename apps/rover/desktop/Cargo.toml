[package]
name = "rover"
version = "0.1.0"
description = "A modern file manager for Linux"
authors = ["Kristof"]
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "rover_lib"

[dependencies]
sabine.workspace = true
serde_json.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["default", "process"] }
walkdir.workspace = true
dirs.workspace = true
chrono.workspace = true
parking_lot.workspace = true
libc.workspace = true
luft-accounts = { workspace = true, features = ["default"] }
luft-app = { workspace = true, features = ["apps", "launch", "settings", "thumbnails", "watch"] }
gio.workspace = true
gio-unix.workspace = true
imagesize.workspace = true
roxmltree.workspace = true
zbus = { workspace = true, features = ["proxy", "service", "tokio"] }
futures-util.workspace = true
url.workspace = true
percent-encoding.workspace = true
ignore.workspace = true
regex.workspace = true
rustc-hash.workspace = true
memchr.workspace = true
zip = { workspace = true, features = ["bzip2", "chrono", "lzma", "xz", "zstd"] }
tar.workspace = true
zstd = { workspace = true, features = ["zstdmt"] }
flate2 = { workspace = true, features = ["zlib-rs"] }
bzip2.workspace = true
liblzma.workspace = true
sevenz-rust2 = { workspace = true, features = ["bzip2", "deflate", "ppmd", "util", "zstd"] }
uzers.workspace = true

[lints]
workspace = true
