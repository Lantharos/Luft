[package]
name = "luft-app"
version = "0.1.0"
description = "Native bootstrap shared by Luft apps"
authors = ["Kristof"]
license = "GPL-3.0-or-later"
edition = "2024"
rust-version = "1.98"

[features]
apps = ["dep:dirs", "dep:gio", "dep:gio-unix"]
fonts = ["dep:dirs", "dep:gio", "dep:memmap2", "dep:skrifa"]
ibus = ["dep:dirs"]
launch = ["dep:gio"]
recovery = ["dep:libc"]
settings = ["dep:dirs"]
thumbnails = [
    "dep:dirs",
    "dep:fast_image_resize",
    "dep:gio",
    "dep:image",
    "dep:libc",
    "dep:md-5",
    "dep:parking_lot",
    "dep:png",
]

[dependencies]
dirs = { version = "7.0.0", optional = true }
fast_image_resize = { version = "6.1.0", optional = true }
futures-util = { version = "0.3.34", default-features = false }
gio = { version = "0.22.10", optional = true }
gio-unix = { version = "0.22.8", optional = true }
image = { version = "0.25.10", optional = true, default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff", "qoi", "tga", "pnm"] }
libc = { version = "0.2.190", optional = true }
luft-dbus = { path = "../dbus" }
luft-i18n = { path = "../i18n" }
md-5 = { version = "0.11.0", optional = true }
memmap2 = { version = "0.9.11", optional = true }
parking_lot = { version = "0.12.5", optional = true }
png = { version = "0.18.1", optional = true }
sabine = { git = "https://github.com/Lantharos/Sabine", tag = "v0.51" }
skrifa = { version = "0.48", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", default-features = false, features = ["rt"] }
zbus = { version = "6.0.0", default-features = false, features = ["proxy", "tokio"] }
