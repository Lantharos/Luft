[package]
name = "schelf"
version = "0.1.0"
description = "Apps for Luft"
authors = ["Kristof"]
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "schelf_lib"

[dependencies]
dirs.workspace = true
flate2 = { workspace = true, features = ["zlib-rs"] }
futures-util.workspace = true
gio.workspace = true
gio-unix.workspace = true
libc.workspace = true
luft-app = { workspace = true, features = ["apps", "launch"] }
luft-software = { workspace = true, features = ["default"] }
quick-xml.workspace = true
sabine.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
tokio = { workspace = true, features = ["macros", "rt", "signal", "sync"] }
zbus = { workspace = true, features = ["proxy", "service", "tokio"] }

[lints]
workspace = true
