[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-or-later"
repository = "https://github.com/Lantharos/Luft"

[workspace.dependencies]
ctap = { path = "kestrel/passkeys/crates/ctap" }
luft-accounts = { path = "packages/system/accounts" }
luft-app = { path = "packages/app" }
luft-dbus = { path = "packages/dbus" }
luft-disks = { path = "packages/system/disks" }
luft-fingerprint = { path = "packages/system/fingerprint" }
luft-i18n = { path = "packages/i18n" }
luft-identity = { path = "packages/identity" }
luft-installer-contract = { path = "apps/setup/contract" }
luft-keyring-vault = { path = "kestrel/keyring/vault" }
luft-keyring-wire = { path = "kestrel/keyring/wire" }
luft-meet = { path = "packages/system/meet" }
luft-network = { path = "packages/system/network" }
luft-sandbox = { path = "apps/schelf/sandbox" }
luft-software = { path = "packages/system/software", default-features = false }
luft-speech = { path = "packages/system/speech" }
luft-trust = { path = "packages/system/trust" }
luft-variant = { path = "packages/system/variant" }
luft-windows = { path = "packages/system/windows" }
sushi = { path = "sushi/crates/sushi" }
sushi-scene = { path = "sushi/crates/sushi-scene" }

