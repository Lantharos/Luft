summary = "A full rice for your desktop: CRT, borders, bloom and glitches"
description = "Animated borders and glow around your windows, CRT, scanlines and colour fringes inside the apps you pick, windows that open and close with a glitch, a fold, a burn or a CRT turning on, and filters over the whole screen or just the wallpaper and taskbar: curvature, colour grading, inverted colours, boosted shadows, chromatic aberration and bloom drawn from what's on it. Lines across the taskbar, Quick Settings and Luft's apps finish it off. Every effect is off until you turn it on, and off it costs nothing. Rules decide which apps get what, games stay untouched in fullscreen unless you say so, and Ctrl+Alt+Escape turns everything off at once. Phosphor draws over everything on your screen, so it asks for that permission; what it draws never leaves your computer."
