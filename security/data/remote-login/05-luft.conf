# Luft's defaults for remote login. sshd keeps the first value it reads, so
# these come before Fedora's 40- and 50- files, and the accounts that may sign
# in and whether passwords are allowed, which luft-remote-login writes from
# its state in /var/lib/luft-remote-login, come before them.
Include /run/luft-remote-login/sshd.conf
PermitRootLogin no
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
RequiredRSASize 2048
GSSAPIAuthentication no
MaxAuthTries 4
LoginGraceTime 30s
MaxStartups 10:30:60
PerSourcePenalties authfail:30s noauth:10s grace-exceeded:30s min:15s max:1h
X11Forwarding no
ClientAliveInterval 60
ClientAliveCountMax 3
