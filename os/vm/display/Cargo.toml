[package]
name = "vm-display"
description = "Plays the part of a graphics card's firmware in a Luft VM: hands over a chosen framebuffer and describes the monitor before starting Luft"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
rust-version.workspace = true

[[bin]]
name = "vm-display"
path = "src/main.rs"

[dependencies]
log.workspace = true
uefi = { workspace = true, features = ["logger"] }

[lints]
workspace = true
