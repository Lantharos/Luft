[package]
name = "luft-app"
version = "0.1.0"
description = "Native bootstrap shared by Luft apps"
authors = ["Kristof"]
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[package.metadata.bindings]
path = "../web/ui/src/bindings/appearance.ts"

[features]
apps = ["dep:dirs", "dep:gio", "dep:gio-unix"]
fonts = ["dep:dirs", "dep:gio", "dep:memmap2", "dep:skrifa"]
ibus = ["dep:dirs"]
launch = ["dep:gio"]
recovery = ["dep:libc"]
settings = ["dep:dirs"]
thumbnails = [
    "dep:dirs",
    "dep:fast_image_resize",
    "dep:gio",
    "dep:image",
    "dep:libc",
    "dep:md-5",
    "dep:parking_lot",
    "dep:png",
]
watch = ["dep:inotify", "dep:libc", "dep:parking_lot"]

[dependencies]
dirs = { workspace = true, optional = true }
fast_image_resize = { workspace = true, optional = true }
futures-util.workspace = true
gio = { workspace = true, optional = true }
gio-unix = { workspace = true, optional = true }
image = { workspace = true, features = [
  "bmp",
  "gif",
  "ico",
  "jpeg",
  "pnm",
  "qoi",
  "tga",
  "tiff",
  "webp",
], optional = true }
inotify = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
luft-dbus.workspace = true
luft-identity.workspace = true
luft-i18n.workspace = true
md-5 = { workspace = true, optional = true }
memmap2 = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
png = { workspace = true, optional = true }
sabine.workspace = true
skrifa = { workspace = true, optional = true }
specta.workspace = true
specta-typescript.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt"] }
zbus = { workspace = true, features = ["proxy", "tokio"] }

[lints]
workspace = true
