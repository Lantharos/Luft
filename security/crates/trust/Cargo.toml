[package]
name = "trustd"
description = "Secure Boot signing, TPM disk unlock and device encryption for Luft"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
access.workspace = true
anyhow.workspace = true
argon2 = { workspace = true, features = ["alloc", "parallel"] }
chacha20poly1305 = { workspace = true, features = ["default"] }
clap.workspace = true
getrandom.workspace = true
libc.workspace = true
rustix = { workspace = true, features = ["fs", "process", "stdio", "termios"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "signal", "sync", "time"] }
zbus = { workspace = true, features = ["proxy", "service", "tokio"] }

[lints]
workspace = true
