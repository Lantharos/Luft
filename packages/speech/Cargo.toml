[package]
name = "luft-speech"
version = "0.1.0"
description = "Dictation models and their downloads, shared by Settings and the speech service"
authors = ["Kristof"]
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = ["client"]
client = ["dep:futures-util", "dep:luft-dbus", "dep:serde_json", "dep:zbus"]

[dependencies]
futures-util = { workspace = true, optional = true }
luft-dbus = { workspace = true, optional = true }
serde.workspace = true
serde_json = { workspace = true, optional = true }
zbus = { workspace = true, features = ["proxy", "tokio"], optional = true }

[lints]
workspace = true
