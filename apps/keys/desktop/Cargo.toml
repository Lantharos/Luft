[package]
name = "keys"
version = "0.1.0"
description = "Keyboard layouts and input methods for Luft"
authors = ["Kristof"]
license = "MIT"
edition = "2024"
rust-version = "1.98"

[lib]
name = "keys_lib"

[dependencies]
dirs = "7.0.0"
futures-util = { version = "0.3.34", default-features = false }
gio = "0.22.10"
inotify = "0.11.5"
libc = "0.2.190"
luft-app = { path = "../../../packages/app", features = ["ibus"] }
roxmltree = "0.21.1"
sabine = { git = "https://github.com/Lantharos/Sabine", tag = "v0.43" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", default-features = false, features = ["fs", "macros", "rt", "sync", "time"] }
toml = "1.1.8"
xkbcommon = { version = "0.9.0", default-features = false }
zbus = { version = "6.0.0", default-features = false, features = ["proxy", "service", "tokio"] }
