name: CI image

on:
  push:
    branches: [main]
    paths:
      - .github/ci/**
      - .github/workflows/ci-image.yml
      - os/image/packages/build.txt
      - os/image/packages/runtime.txt
      - os/versions.env
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: ${{ matrix.image }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ghcr.io/lantharos/luft-ci
            containerfile: .github/ci/Containerfile
            context: .github/ci
          - image: ghcr.io/lantharos/luft-ci-kestrel
            containerfile: .github/ci/kestrel/Containerfile
            context: os/image/packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/registry

      - uses: ./.github/actions/versions

      - name: Build
        env:
          IMAGE: ${{ matrix.image }}
          CONTAINERFILE: ${{ matrix.containerfile }}
          CONTEXT: ${{ matrix.context }}
        run: >-
          podman build --pull=always --label org.opencontainers.image.source=https://github.com/Lantharos/Luft
          --build-arg "FEDORA=$FEDORA" --build-arg "BUN_VERSION=$BUN_VERSION" --build-arg "BUN_SHA256=$BUN_SHA256"
          --file "$CONTAINERFILE" --tag "$IMAGE:latest" "$CONTEXT"

      - name: Publish
        env:
          IMAGE: ${{ matrix.image }}
        run: podman push "$IMAGE:latest"
