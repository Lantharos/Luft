[package]
name = "luft-speech-service"
version = "0.1.0"
description = "Dictation for Luft: listens while asked and turns speech into text on this computer"
authors = ["Kristof"]
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "luft-speech"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
gio.workspace = true
libc.workspace = true
luft-speech.workspace = true
ort = { workspace = true, features = ["api-24", "std"] }
pipewire.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
ureq.workspace = true
whisper-rs = { workspace = true, features = ["vulkan"] }
zbus = { workspace = true, features = ["proxy", "service", "tokio"] }

[lints]
workspace = true
