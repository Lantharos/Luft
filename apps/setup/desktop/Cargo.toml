[package]
name = "setup"
version = "0.1.0"
description = "Installs Luft and sets up a new computer"
authors = ["Kristof"]
license = "MIT"
edition = "2024"
rust-version = "1.98"

[lib]
name = "setup_lib"

[dependencies]
futures-util = { version = "0.3.34", default-features = false }
gio = "0.22.10"
gio-unix = "0.22.8"
luft-app = { path = "../../../packages/app", features = ["launch", "recovery"] }
luft-fingerprint = { path = "../../../packages/fingerprint" }
luft-meet = { path = "../../../packages/meet" }
luft-network = { path = "../../../packages/network" }
luft-variant = { path = "../../../packages/variant" }
roxmltree = "0.21.1"
sabine = { git = "https://github.com/Lantharos/Sabine", tag = "v0.46" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", default-features = false, features = ["rt"] }
ureq = { version = "3.4.2", features = ["platform-verifier"] }
zbus = { version = "6.0.0", default-features = false, features = ["proxy", "tokio"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
