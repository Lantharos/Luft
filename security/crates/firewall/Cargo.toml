[package]
name = "luft-firewall"
description = "Keeps devices on the network from reaching the computer, more leniently on home networks"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
futures-util = { workspace = true, features = ["std"] }
luft-dbus.workspace = true
luft-dbus-macros.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "signal", "sync"] }
zbus = { workspace = true, features = ["proxy", "service", "tokio"] }

[lints]
workspace = true
