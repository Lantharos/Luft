id = "com.example.Probe"
name = "Probe"
description = "Uses every part of the extension API that a check can watch."
version = "1.0.0"
api = 1
permissions = ["taskbar", "quick-settings", "search", "notifications"]

[[settings]]
key = "on"
type = "switch"
label = "on"
default = false

[[settings]]
key = "mood"
type = "choice"
label = "mood"
default = "calm"
options = [
  { value = "calm", label = "calm" },
  { value = "giddy", label = "giddy" },
]

[[settings]]
key = "level"
type = "slider"
label = "level"
default = 0.5
min = 0
max = 1
unit = "percent"
depends = "on"
