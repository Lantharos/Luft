part = "kestrel"

[programs]
"/usr/libexec/" = ["kestrel-greeter-service"]

[files]
"/usr/share/dbus-1/system.d/" = ["data/com.lantharos.Greeter1.conf", "data/com.lantharos.Password1.conf"]
"/usr/share/dbus-1/system-services/" = ["data/com.lantharos.Greeter1.service", "data/com.lantharos.Password1.service"]
"/usr/lib/systemd/system/" = ["data/kestrel-greeter.service", "data/kestrel-password.service"]
"/usr/lib/systemd/system/greetd.service.d/kestrel-greeter.conf" = "data/greetd.service.conf"
"/usr/share/polkit-1/actions/" = ["data/com.lantharos.greeter.policy", "data/com.lantharos.password.policy"]
"/usr/lib/tmpfiles.d/kestrel-greeter.conf" = "data/kestrel-greeter.tmpfiles"
"/usr/lib/kestrel-greeter/" = ["data/greetd.toml"]
"/usr/share/selinux/packages/" = ["data/luft-greeter.cil"]

[enable]
system = ["greetd.service"]
