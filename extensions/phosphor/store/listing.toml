name = "Phosphor"
summary = "A full rice for your desktop: CRT, borders, bloom and glitches"
description = "Pick a whole look in one click, from Terminal green and Amber CRT to Vaporwave, Noir film, VHS tape, Clean neon and Pocket, or make your own, save it and share it as a small file. Animated borders and glow around your windows, CRT, scanlines and colour fringes inside the apps you pick, double, dashed, neon and rainbow borders in each app's own colour, hard offset shadows, windows that open and close with a glitch, a fold, a burn, a beam, shatter or static, and filters over the whole screen or just the wallpaper and taskbar: curvature and phosphor masks, VHS tracking and colour bleed, glitches now and then, colour grades and duotones, retro palettes with dithering, pixels, halftone, film grain, chromatic aberration and bloom drawn from what's on it. Lines across the taskbar, Quick Settings and Luft's apps finish it off. Every effect is off until you turn it on, and off it costs nothing. Rules decide which apps get what, games stay untouched in fullscreen unless you say so, and Ctrl+Alt+Escape turns everything off at once. Phosphor draws over everything on your screen, so it asks for that permission; what it draws never leaves your computer."
