name: Build a part
description: Builds one part of the Luft image and publishes it, keeping the compilers' caches between runs.

inputs:
  part:
    description: The part, as os/image/build.sh plan names it
    required: true
  key:
    description: The part's key, which names its compiler cache
    required: true
  family:
    description: Parts whose compiler caches are close enough to start from
    required: true

runs:
  using: composite
  steps:
    - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

    - uses: ./.github/actions/registry

    - name: Compiler cache folder
      shell: bash
      run: echo "LUFT_IMAGE_CACHE=$RUNNER_TEMP/luft-cache" >> "$GITHUB_ENV"

    - name: Restore the compiler caches
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ runner.temp }}/luft-cache/sccache
          ${{ runner.temp }}/luft-cache/ccache
        key: luft-${{ inputs.part }}-${{ inputs.key }}
        restore-keys: |
          luft-${{ inputs.part }}-
          luft-${{ inputs.family }}-

    - name: Build ${{ inputs.part }}
      shell: bash
      env:
        PART: ${{ inputs.part }}
      run: os/image/build.sh part "$PART" --cache-from "$CACHE" --cache-to "$CACHE"

    - name: Keep the compiler caches
      if: always() && github.ref_type != 'tag'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ runner.temp }}/luft-cache/sccache
          ${{ runner.temp }}/luft-cache/ccache
        key: luft-${{ inputs.part }}-${{ inputs.key }}
