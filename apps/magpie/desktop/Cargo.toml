[package]
name = "magpie"
version = "0.1.0"
description = "Photos, videos, music and documents for Luft"
authors = ["Kristof"]
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "magpie_lib"

[dependencies]
dirs.workspace = true
gio.workspace = true
gio-unix.workspace = true
glycin = { workspace = true, features = ["tokio"] }
imagesize.workspace = true
kamadak-exif.workspace = true
lofty.workspace = true
luft-app = { workspace = true, features = ["apps", "fonts", "launch", "thumbnails", "watch"] }
luft-dbus-macros.workspace = true
matroska-demuxer.workspace = true
parking_lot.workspace = true
sabine.workspace = true
serde.workspace = true
skrifa.workspace = true
specta.workspace = true
tokio = { workspace = true, features = ["sync"] }
write-fonts.workspace = true
wuff.workspace = true
zbus = { workspace = true, features = ["service", "tokio"] }

[lints]
workspace = true
