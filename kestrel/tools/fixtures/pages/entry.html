<!doctype html>
<meta charset="utf-8">
<title>Kestrel field</title>
<style>input { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; font-size: 32px; }</style>
<input id="field" autocomplete="off" autocapitalize="off">
<script>field.addEventListener('input', () => { document.title = `Kestrel typed: ${field.value}`; });</script>
