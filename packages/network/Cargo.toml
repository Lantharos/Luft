[package]
name = "luft-network"
version = "0.1.0"
description = "Wi-Fi, wired, VPN and connection profiles through NetworkManager, shared by Settings and Setup"
authors = ["Kristof"]
license = "MIT"
edition = "2024"
rust-version = "1.98"

[dependencies]
getrandom = "0.4.3"
gio = "0.22.10"
luft-app = { path = "../app" }
sabine = { git = "https://github.com/Lantharos/Sabine", tag = "v0.43" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
x25519-dalek = { version = "3.0.0", default-features = false }
zbus = { version = "5.19.0", default-features = false, features = ["blocking-api", "tokio"] }
