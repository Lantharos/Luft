[app]
id = "com.lantharos.easel"
name = "Easel"
generic_name = "Image Editor"
categories = ["Graphics", "2DGraphics", "RasterGraphics"]
keywords = ["image editor", "photo editor", "paint", "drawing", "draw", "sketch", "crop", "resize", "markup", "annotate", "layers", "whiteboard", "diagram", "brainstorm", "paint.net", "photoshop", "gimp", "krita", "pinta", "mspaint", "excalidraw"]
version = "0.1.0"
maintainer = "Lantharos <kristof@lanth.me>"
icon = "public/favicon.svg"
cargo_manifest = "desktop/Cargo.toml"
mime_types = [
	"application/vnd.lantharos.easel",
	"image/png",
	"image/jpeg",
	"image/webp",
	"image/avif",
	"image/gif",
	"image/bmp",
	"image/tiff",
	"image/heic",
	"image/heif",
	"image/vnd.adobe.photoshop",
	"image/x-adobe-dng",
	"image/x-canon-cr2",
	"image/x-canon-cr3",
	"image/x-canon-crw",
	"image/x-epson-erf",
	"image/x-fuji-raf",
	"image/x-hasselblad-3fr",
	"image/x-nikon-nef",
	"image/x-olympus-orf",
	"image/x-panasonic-rw2",
	"image/x-pentax-pef",
	"image/x-phaseone-iiq",
	"image/x-sony-arw"
]

[app.extensions]
"application/vnd.lantharos.easel" = ["easel"]

[install]
command = "cargo run --manifest-path desktop/Cargo.toml --"

[web]
root = "."
dist = "dist"
entry = "dist/index.html"
build = "bun run build"
local_files = true

[updates]
provider = "schelf"

[sandbox]
unsandboxed = true
reason = "It opens and saves pictures wherever they are, and decodes them in sandboxes of its own, which can't start inside another one."

[bindings]
path = "src/lib/bindings.ts"
