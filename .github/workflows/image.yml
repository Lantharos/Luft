name: Image

on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/lantharos/luft
  CACHE: ghcr.io/lantharos/luft-cache
  FEDORA: "45"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Make room
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v5
        with:
          fetch-depth: 50

      - name: Sign in to the registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Signing keys
        env:
          KEY: ${{ secrets.LUFT_SECUREBOOT_KEY }}
          CERT: ${{ secrets.LUFT_SECUREBOOT_CERT }}
          PCR_KEY: ${{ secrets.LUFT_PCR_KEY }}
        run: |
          keys="$RUNNER_TEMP/secure-boot"
          mkdir -m 700 "$keys"
          if [[ -n "$KEY" && -n "$CERT" && -n "$PCR_KEY" ]]; then
            printf '%s\n' "$KEY" > "$keys/key.pem"
            printf '%s\n' "$CERT" > "$keys/cert.pem"
            printf '%s\n' "$PCR_KEY" > "$keys/pcr.pem"
            cmp <(openssl x509 -in "$keys/cert.pem" -outform DER) os/image/keys/luft-secureboot.der ||
              { echo "::error::LUFT_SECUREBOOT_CERT isn't the certificate in os/image/keys"; exit 1; }
            cmp <(openssl pkey -in "$keys/pcr.pem" -pubout) os/image/keys/luft-pcr-policy.pub.pem ||
              { echo "::error::LUFT_PCR_KEY doesn't match the public key in os/image/keys"; exit 1; }
          else
            openssl req -x509 -newkey rsa:2048 -nodes -days 30 -subj "/CN=Luft ephemeral key" \
              -keyout "$keys/key.pem" -out "$keys/cert.pem"
            openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$keys/pcr.pem"
            echo "::warning::LUFT_SECUREBOOT_KEY, LUFT_SECUREBOOT_CERT or LUFT_PCR_KEY isn't set. The images are signed with ephemeral keys that computers won't trust."
          fi
          {
            echo "KEYS=$keys"
            echo "LUFT_SECUREBOOT_KEY=$keys/key.pem"
            echo "LUFT_SECUREBOOT_CERT=$keys/cert.pem"
            echo "LUFT_PCR_KEY=$keys/pcr.pem"
            echo "LUFT_IMAGE_STATE=$RUNNER_TEMP/image"
            echo "TMPDIR=$RUNNER_TEMP"
          } >> "$GITHUB_ENV"

      - name: Version and release notes
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME#v}"
            tags=("$FEDORA" "$version")
            since="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-parse HEAD~10)"
          else
            if [[ "$GITHUB_EVENT_NAME" == schedule && -z "$(git log --since=24.hours --format=%H -1)" ]]; then
              echo "No changes since the last nightly build."
              echo "SKIP=1" >> "$GITHUB_ENV"
              exit 0
            fi
            version="$FEDORA.$(date -u +%Y%m%d).${{ github.run_number }}-nightly"
            tags=("$FEDORA-nightly" "$version")
            since="$(git rev-list -1 --before=24.hours HEAD)"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAGS=${tags[*]}" >> "$GITHUB_ENV"
          echo "REFERENCE=$IMAGE:${tags[0]}" >> "$GITHUB_ENV"
          git log --no-merges --format='- %s' "$since..HEAD" > "$RUNNER_TEMP/release-notes.txt"

      - name: Build luft
        if: env.SKIP != '1'
        run: |
          os/image/build.sh luft --cache-from "$CACHE" --cache-to "$CACHE" \
            --build-arg "VERSION=$VERSION" --build-arg "IMAGE_REFERENCE=$REFERENCE" \
            --build-arg "RELEASE_NOTES=$(cat "$RUNNER_TEMP/release-notes.txt")"

      - name: Build luft-nvidia
        if: env.SKIP != '1'
        run: |
          os/image/build.sh luft-nvidia --cache-from "$CACHE" --cache-to "$CACHE" \
            --build-arg "VERSION=$VERSION" --build-arg "IMAGE_REFERENCE=$REFERENCE" \
            --build-arg "RELEASE_NOTES=$(cat "$RUNNER_TEMP/release-notes.txt")"
          rm -rf "$KEYS"

      - name: Push
        if: env.SKIP != '1'
        run: |
          for tag in $TAGS; do
            podman push "localhost/luft:$FEDORA" "$IMAGE:$tag"
            podman push "localhost/luft:$FEDORA-nvidia" "$IMAGE:$tag-nvidia"
          done
