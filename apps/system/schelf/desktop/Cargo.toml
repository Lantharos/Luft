[package]
name = "schelf"
version = "0.1.0"
description = "Apps for Luft"
authors = ["Kristof"]
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "schelf_lib"

[dependencies]
chrono = { workspace = true, features = ["serde"] }
dirs.workspace = true
flate2 = { workspace = true, features = ["zlib-rs"] }
futures-util.workspace = true
getrandom.workspace = true
gio.workspace = true
gio-unix = { workspace = true, features = ["v2_58"] }
libc.workspace = true
luft-app = { workspace = true, features = ["apps", "launch"] }
luft-dbus-macros.workspace = true
luft-sandbox.workspace = true
luft-software = { workspace = true, features = ["default"] }
luft-store-seal.workspace = true
memmap2.workspace = true
quick-xml.workspace = true
sabine.workspace = true
sabine-service.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
specta.workspace = true
specta-typescript.workspace = true
tar.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "signal", "sync"] }
ureq.workspace = true
zbus = { workspace = true, features = ["proxy", "service", "tokio"] }
zstd.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
