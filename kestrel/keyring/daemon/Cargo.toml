[package]
name = "luft-keyring"
description = "Luft's secret store"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
aes.workspace = true
base64.workspace = true
cbc.workspace = true
crypto-bigint.workspace = true
ed25519-dalek.workspace = true
futures-util.workspace = true
getrandom.workspace = true
hkdf.workspace = true
hmac.workspace = true
libc.workspace = true
luft-identity.workspace = true
p256 = { workspace = true, features = ["ecdsa", "std"] }
postcard.workspace = true
rustix = { workspace = true, features = ["fs", "mm", "net", "pipe", "process"] }
serde.workspace = true
serde_json.workspace = true
luft-keyring-vault.workspace = true
luft-keyring-wire = { workspace = true, features = ["tokio"] }
sha2.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt", "signal", "sync", "time"] }
zbus = { workspace = true, features = ["proxy", "service", "tokio"] }
zeroize = { workspace = true, features = ["derive", "serde"] }

[lints]
workspace = true
