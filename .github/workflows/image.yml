name: Image

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      rebuild:
        description: Build every part again instead of reusing the unchanged ones
        type: boolean
        default: false
      promote:
        description: Release this tested nightly as the stable version it leads to, such as 1.2-nightly.21
        type: string
        default: ""

concurrency:
  group: image-${{ inputs.promote && 'promote' || github.ref }}
  cancel-in-progress: ${{ !inputs.promote }}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/lantharos/luft
  CACHE: ghcr.io/lantharos/luft-cache
  LUFT_PARTS: ghcr.io/lantharos/luft-parts
  LUFT_PARTS_SIGNER: ${{ github.server_url }}/${{ github.workflow_ref }}
  DOWNLOADS: https://get.luft.computer

jobs:
  release:
    name: Release
    if: inputs.promote
    uses: ./.github/workflows/release.yml
    with:
      nightly: ${{ inputs.promote }}
    secrets:
      COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
      COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      LUFT_ISO_MINISIGN_KEY: ${{ secrets.LUFT_ISO_MINISIGN_KEY }}
      LUFT_MEET_UPDATE_KEY: ${{ secrets.LUFT_MEET_UPDATE_KEY }}
    permissions:
      contents: write
      packages: write
      id-token: write

  store-promote:
    name: Store releases to stable
    needs: release
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: ./.github/actions/bun

      - name: Send this nightly's apps and extensions to stable
        env:
          STORE_RELEASES: ${{ needs.release.outputs.store-releases }}
        run: bun .github/scripts/store/index.ts promote "$STORE_RELEASES"

  plan:
    if: "!inputs.promote"
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      id-token: write
    outputs:
      skip: ${{ steps.version.outputs.skip }}
      version: ${{ steps.version.outputs.version }}
      tags: ${{ steps.version.outputs.tags }}
      notes: ${{ steps.version.outputs.notes }}
      stable-released: ${{ steps.version.outputs.stable-released }}
      base: ${{ steps.parts.outputs.base }}
      store: ${{ steps.parts.outputs.store }}
      parts: ${{ steps.parts.outputs.parts }}
      signed: ${{ steps.parts.outputs.signed }}
      details: ${{ steps.parts.outputs.details }}
      sabine: ${{ steps.store.outputs.sabine }}
      apps: ${{ steps.store.outputs.apps }}
      extensions: ${{ steps.store.outputs.extensions }}
      publish: ${{ steps.store.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/bun

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - uses: ./.github/actions/registry

      - name: Apps and extensions that changed since their last release
        id: store
        run: bun .github/scripts/store/index.ts plan >> "$GITHUB_OUTPUT"

      - name: Version and release notes
        id: version
        env:
          PUBLISH: ${{ steps.store.outputs.publish }}
        run: |
          nightly="$(skopeo inspect --retry-times 3 --format '{{json .Labels}}' "docker://$IMAGE:$MAJOR-nightly")"
          built="$(jq -r '."org.opencontainers.image.revision" // empty' <<<"$nightly")"
          base="$(os/image/build.sh base)"
          cef="$(os/image/build.sh cef)"
          store="$(os/image/build.sh store)"
          {
            echo "LUFT_BASE=$base"
            echo "LUFT_STORE=$store"
          } >> "$GITHUB_ENV"
          if [[ "$GITHUB_EVENT_NAME" == schedule && "$built" == "$GITHUB_SHA" && "$PUBLISH" == "[]" &&
                "$base" == "$(jq -r '."org.opencontainers.image.base.name" // empty' <<<"$nightly")" &&
                "$cef" == "$(jq -r '."com.lantharos.cef" // empty' <<<"$nightly")" &&
                "$store" == "$(jq -r '."com.lantharos.store" // empty' <<<"$nightly")" ]] &&
            LUFT_BASE="$base" os/image/build.sh updates "$IMAGE:$MAJOR-nightly"; then
            echo "Nothing changed since the last nightly."
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last="$(git tag --list "v$MAJOR.*" | sed -nE "s/^v$MAJOR\.([0-9]+)$/\1/p" | sort -n | tail -n 1)"
          target="$MAJOR.$(( ${last:--1} + 1 ))"
          current="$(jq -r '."org.opencontainers.image.version" // empty' <<<"$nightly")"
          number=1
          [[ "$current" =~ ^"$target"-nightly\.([0-9]+)$ ]] && number=$(( BASH_REMATCH[1] + 1 ))
          version="$target-nightly.$number"
          tags=("$MAJOR-nightly" "$version")
          {
            echo "version=$version"
            echo "tags=${tags[*]}"
            echo "stable-released=${last:+1}"
            echo "notes=$(bun .github/scripts/changelog/index.ts since "$built")"
          } >> "$GITHUB_OUTPUT"

      - name: Parts
        id: parts
        if: steps.version.outputs.skip != '1'
        env:
          LUFT_SECUREBOOT_CERT: os/image/keys/luft-secureboot.crt
          LUFT_REBUILD: ${{ inputs.rebuild && '1' || '' }}
        run: |
          os/image/build.sh plan luft-nvidia | tee "$RUNNER_TEMP/parts.tsv"
          rows() {
            jq --raw-input --slurp --compact-output '[
              split("\n")[] | select(length > 0) | split("\t") | select(.[2] == "missing") |
              {name: .[0], key: (.[1] | sub(".*-"; "")), family: (.[0] | sub("-.*"; "")), signing: .[3]}
            ]' "$RUNNER_TEMP/parts.tsv"
          }
          missing="$(rows)"
          {
            echo "base=$LUFT_BASE"
            echo "store=$LUFT_STORE"
            echo "parts=$(jq -c '[.[] | select(.signing == "unsigned" and .name != "store") | .name]' <<<"$missing")"
            echo "signed=$(jq -c '[.[] | select(.signing == "signed") | .name]' <<<"$missing")"
            echo "details=$(jq -c 'map({(.name): {key, family}}) | add // {}' <<<"$missing")"
          } >> "$GITHUB_OUTPUT"

  store-apps:
    name: App (${{ matrix.app.name }})
    needs: plan
    if: needs.plan.outputs.apps != '' && needs.plan.outputs.apps != '[]'
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: Lantharos/Sabine/.github/workflows/release-app.yml@0bd7346ef3b1d098caa383dc2ceb7addeb63d909
    with:
      sabine_version: ${{ needs.plan.outputs.sabine }}
      app: ${{ matrix.app.folder }}
      platforms: ${{ matrix.app.platforms }}
      version: ${{ matrix.app.version }}
      artifact: app-${{ matrix.app.name }}
      linux_packages: libglib2.0-dev libseccomp-dev libclang-dev libpipewire-0.3-dev libspa-0.2-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      # Building the MSI package accepts the WiX 7 licence: https://docs.firegiant.com/wix/osmf/
      accept_wix_eula: true
    secrets:
      SABINE_UPDATE_SIGNING_KEY: ${{ secrets.SABINE_UPDATE_SIGNING_KEY }}
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

  store-extensions:
    name: Extension (${{ matrix.extension.name }} on ${{ matrix.extension.runner }})
    needs: plan
    if: needs.plan.outputs.extensions != '' && needs.plan.outputs.extensions != '[]'
    strategy:
      fail-fast: false
      matrix:
        extension: ${{ fromJSON(needs.plan.outputs.extensions) }}
    runs-on: ${{ matrix.extension.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/bun

      - run: bun install --frozen-lockfile

      - name: Install Rust for a native helper
        if: hashFiles(format('{0}/helper/Cargo.toml', matrix.extension.folder)) != ''
        run: rustup update stable && rustup default stable

      - name: Use the version being released
        env:
          VERSION: ${{ matrix.extension.version }}
          FOLDER: ${{ matrix.extension.folder }}
        run: sed -i "s/^version = \".*\"$/version = \"$VERSION\"/" "$FOLDER/extension.toml"

      - env:
          FOLDER: ${{ matrix.extension.folder }}
        run: extensions/pack.sh "$FOLDER" dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-${{ matrix.extension.name }}-${{ matrix.extension.runner }}
          path: dist
          if-no-files-found: error

  store-publish:
    name: Publish (${{ matrix.item.name }} ${{ matrix.item.version }})
    needs: [plan, store-apps, store-extensions]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.publish != '[]' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        item: ${{ fromJSON(needs.plan.outputs.publish) }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ matrix.item.kind }}-${{ matrix.item.name }}-*
          path: dist
          merge-multiple: true

      - uses: Lantharos/Store/publish@7e53e9f6a67aae2b59c9ae79e91aad5e392c4227 # v1
        with:
          files: dist/**
          schelf-toml: ${{ matrix.item.folder }}/schelf.toml
          version: ${{ matrix.item.version }}
          channel: nightly
          notes: ${{ matrix.item.notes }}

  store-part:
    name: Store part
    needs: [plan, store-publish]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.skip != '1' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 75
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      store: ${{ steps.releases.outputs.store }}
      releases: ${{ steps.releases.outputs.releases }}
    env:
      LUFT_BASE: ${{ needs.plan.outputs.base }}
      LUFT_SECUREBOOT_CERT: os/image/keys/luft-secureboot.crt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/bun

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - uses: ./.github/actions/registry

      - name: Wait for tonight's releases to pass their checks
        if: needs.plan.outputs.publish != '[]'
        env:
          PUBLISH: ${{ needs.plan.outputs.publish }}
        run: bun .github/scripts/store/index.ts settle "$PUBLISH"

      - name: Releases the image ships with
        id: releases
        run: |
          store="$(os/image/build.sh store)"
          echo "store=$store" >> "$GITHUB_OUTPUT"
          bun .github/scripts/store/index.ts catalog >> "$GITHUB_OUTPUT"
          echo "LUFT_STORE=$store" >> "$GITHUB_ENV"

      - name: Build the part
        run: |
          state="$(os/image/build.sh plan luft | awk -F '\t' '$1 == "store" {print $3}')"
          [[ "$state" != missing ]] || os/image/build.sh part store --cache-from "$CACHE" --cache-to "$CACHE"

  parts:
    name: Part
    needs: plan
    if: needs.plan.outputs.skip != '1' && needs.plan.outputs.parts != '[]'
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.plan.outputs.parts) }}
    env:
      LUFT_BASE: ${{ needs.plan.outputs.base }}
      LUFT_STORE: ${{ needs.plan.outputs.store }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/build-part
        with:
          part: ${{ matrix.part }}
          key: ${{ fromJSON(needs.plan.outputs.details)[matrix.part].key }}
          family: ${{ fromJSON(needs.plan.outputs.details)[matrix.part].family }}

  signed-parts:
    name: Signed part
    needs: plan
    if: needs.plan.outputs.skip != '1' && needs.plan.outputs.signed != '[]'
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    environment: signing
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.plan.outputs.signed) }}
    env:
      LUFT_BASE: ${{ needs.plan.outputs.base }}
      LUFT_STORE: ${{ needs.plan.outputs.store }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/signing-keys
        with:
          key: ${{ secrets.LUFT_SECUREBOOT_KEY }}
          certificate: ${{ secrets.LUFT_SECUREBOOT_CERT }}

      - uses: ./.github/actions/build-part
        with:
          part: ${{ matrix.part }}
          key: ${{ fromJSON(needs.plan.outputs.details)[matrix.part].key }}
          family: ${{ fromJSON(needs.plan.outputs.details)[matrix.part].family }}

      - name: Forget the signing keys
        if: always()
        run: rm -rf "$LUFT_KEYS"

  image:
    name: Images
    needs: [plan, parts, signed-parts, store-part]
    if: >-
      always() && needs.plan.result == 'success' && needs.plan.outputs.skip != '1' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    environment: signing
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      LUFT_BASE: ${{ needs.plan.outputs.base }}
      LUFT_STORE: ${{ needs.store-part.outputs.store }}
      STORE_RELEASES: ${{ needs.store-part.outputs.releases }}
      VERSION: ${{ needs.plan.outputs.version }}
      RELEASE_NOTES: ${{ needs.plan.outputs.notes }}
      LUFT_STABLE_RELEASED: ${{ needs.plan.outputs.stable-released }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/make-room

      - uses: ./.github/actions/versions

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - uses: ./.github/actions/registry

      - name: Build folders
        run: |
          {
            echo "LUFT_IMAGE_STATE=$RUNNER_TEMP/image"
            echo "TMPDIR=$RUNNER_TEMP"
          } >> "$GITHUB_ENV"

      - uses: ./.github/actions/signing-keys
        with:
          key: ${{ secrets.LUFT_SECUREBOOT_KEY }}
          certificate: ${{ secrets.LUFT_SECUREBOOT_CERT }}
          seal: true
          pcr-key-1: ${{ secrets.LUFT_PCR_KEY }}
          pcr-key-2: ${{ secrets.LUFT_PCR_KEY_2 }}

      - name: Build both images
        run: |
          os/image/build.sh luft luft-nvidia --cache-from "$CACHE" --cache-to "$CACHE" \
            --build-arg "VERSION=$VERSION" --build-arg "REVISION=$GITHUB_SHA" --build-arg "RELEASE_NOTES=$RELEASE_NOTES" \
            --build-arg "STORE_RELEASES=$STORE_RELEASES"

      - name: Forget the signing keys
        if: always()
        run: rm -rf "$LUFT_KEYS"

      - name: Push and sign
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          key="$(mktemp -d)"
          trap 'rm -rf "$key"' EXIT
          printf '%s\n' "$COSIGN_PRIVATE_KEY" > "$key/private"
          printf '%s' "$COSIGN_PASSWORD" > "$key/password"
          install -Dm644 -t ~/.config/containers/registries.d os/image/files/etc/containers/registries.d/luft.yaml
          for suffix in "" -nvidia; do
            podman push --sign-by-sigstore-private-key "$key/private" --sign-passphrase-file "$key/password" \
              --digestfile "$key/digest" "localhost/luft:$FEDORA$suffix" "$IMAGE:$VERSION$suffix"
            cosign sign --yes "$IMAGE@$(<"$key/digest")"
          done

  gate:
    name: Boot test (${{ matrix.variant.name }})
    needs: [plan, image]
    if: always() && needs.image.result == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        variant:
          - name: default
            suffix: ""
          - name: NVIDIA
            suffix: -nvidia
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      SUFFIX: ${{ matrix.variant.suffix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/make-room

      - uses: ./.github/actions/versions

      - uses: ./.github/actions/registry

      - name: QEMU with KVM
        run: |
          echo "LUFT_VM=$RUNNER_TEMP/vm" >> "$GITHUB_ENV"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update --quiet
          sudo apt-get install --yes --quiet --no-install-recommends qemu-system-x86 qemu-utils ovmf swtpm
          sudo apparmor_parser --remove /etc/apparmor.d/usr.bin.swtpm

      - name: Install the new nightly
        run: |
          password="$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          echo "VM_PASSWORD=$password" >> "$GITHUB_ENV"
          podman pull --quiet "$IMAGE:$VERSION$SUFFIX" > /dev/null
          VM_PASSWORD="$password" VM_FOLLOWS="$IMAGE:$MAJOR-nightly$SUFFIX" os/vm/disk.sh "$IMAGE:$VERSION$SUFFIX"

      - name: Start it with Secure Boot and sign in
        run: os/vm/check.py --out "$RUNNER_TEMP/boot-test" session

      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: boot-test${{ matrix.variant.suffix }}
          path: |
            ${{ runner.temp }}/boot-test
            ${{ runner.temp }}/vm/install.log
          if-no-files-found: ignore
          retention-days: 14

  publish:
    needs: [plan, image, gate]
    if: always() && needs.gate.result == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAGS: ${{ needs.plan.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/actions
            os/versions.env
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/versions

      - uses: ./.github/actions/registry

      - name: Publish the release notes
        env:
          NOTES: ${{ needs.plan.outputs.notes }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          previous="$(skopeo inspect --retry-times 3 --format '{{index .Labels "org.opencontainers.image.version"}}' "docker://$IMAGE:$MAJOR-nightly")"
          jq -n --arg version "$VERSION" --arg previous "$previous" --argjson notes "$NOTES" \
            '{version: $version, previous: $previous, notes: $notes}' |
            aws s3 cp - "s3://$R2_BUCKET/nightly/notes/$VERSION.json" --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
              --content-type application/json --only-show-errors

      - name: Tag both images
        run: |
          for tag in $TAGS; do
            [[ "$tag" != "$VERSION" ]] || continue
            for suffix in "" -nvidia; do
              skopeo copy --retry-times 3 --preserve-digests "docker://$IMAGE:$VERSION$suffix" "docker://$IMAGE:$tag$suffix"
            done
          done

  nightly-stick:
    name: Nightly stick
    needs: publish
    if: always() && needs.publish.result == 'success'
    uses: ./.github/workflows/iso.yml
    with:
      channel: nightly
    secrets:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      LUFT_ISO_MINISIGN_KEY: ${{ secrets.LUFT_ISO_MINISIGN_KEY }}
      LUFT_MEET_UPDATE_KEY: ${{ secrets.LUFT_MEET_UPDATE_KEY }}
    permissions:
      contents: read
      packages: read
