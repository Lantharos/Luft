# Luft's defaults for remote login. sshd keeps the first value it reads, so
# these come before Fedora's 40- and 50- files. Settings keeps
# 10-luft-remote-login.conf, with the accounts that may sign in and whether
# passwords are allowed.
PermitRootLogin no
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
GSSAPIAuthentication no
MaxAuthTries 4
LoginGraceTime 30s
MaxStartups 10:30:60
PerSourcePenalties authfail:30s noauth:10s grace-exceeded:30s min:15s max:1h
X11Forwarding no
ClientAliveInterval 60
ClientAliveCountMax 3
