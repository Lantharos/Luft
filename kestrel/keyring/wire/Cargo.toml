[package]
name = "luft-keyring-wire"
description = "Messages between Luft Keyring's sign-in module, its unlock service and the keyring"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
tokio = ["dep:tokio"]

[dependencies]
postcard.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt", "signal", "sync", "time"], optional = true }
zeroize = { workspace = true, features = ["derive", "serde"] }

[lints]
workspace = true
