[package]
name = "peek"
description = "Sees and uses windows on Luft"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-or-later"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
rustix = { version = "1.1.5", features = ["event", "fs", "pipe", "process", "stdio"] }
serde_json = "1.0.151"
signal-hook = "0.4.5"
zbus = "5.19.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
