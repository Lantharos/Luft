name: CI image

on:
  push:
    branches: [main]
    paths:
      - .github/ci/**
      - .github/workflows/ci-image.yml
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/lantharos/luft-ci

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/registry

      - name: Build
        run: >-
          podman build --pull=always --label org.opencontainers.image.source=https://github.com/Lantharos/Luft
          --tag "$IMAGE:latest" .github/ci

      - name: Publish
        run: podman push "$IMAGE:latest"
