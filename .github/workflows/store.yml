name: Publish to Schelf
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Publish {0} to {1}', inputs.app, inputs.channel) || github.event_name == 'schedule' && 'Publish nightlies' || 'Publish changed versions' }}

on:
  workflow_dispatch:
    inputs:
      app:
        description: App or extension
        type: choice
        options: [draft, magpie, mailman, meet, rover, tern, rain, visualizer, now-playing]
      channel:
        description: Channel
        type: choice
        options: [stable, beta, nightly]
        default: stable
  push:
    branches: [main]
    paths:
      - apps/*/Sabine.toml
      - extensions/*/extension.toml
  schedule:
    - cron: "17 2 * * *"

concurrency:
  group: store-${{ github.event_name == 'workflow_dispatch' && format('{0}-{1}', inputs.app, inputs.channel) || github.event_name }}

permissions:
  contents: read

jobs:
  changes:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            bun .github/scripts/store/plan.ts nightly >> "$GITHUB_OUTPUT"
          else
            bun .github/scripts/store/plan.ts changed "${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish each one in a run of its own
        env:
          GH_TOKEN: ${{ github.token }}
          APPS: ${{ steps.plan.outputs.apps }}
          CHANNEL: ${{ github.event_name == 'schedule' && 'nightly' || 'stable' }}
        run: |
          for app in $(jq -r '.[]' <<< "$APPS"); do
            gh workflow run store.yml --ref "$GITHUB_REF_NAME" -f app="$app" -f channel="$CHANNEL"
            echo "Started $app on $CHANNEL" >> "$GITHUB_STEP_SUMMARY"
          done

  plan:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    outputs:
      kind: ${{ steps.plan.outputs.kind }}
      folder: ${{ steps.plan.outputs.folder }}
      sabine: ${{ steps.plan.outputs.sabine }}
      platforms: ${{ steps.plan.outputs.platforms }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - id: plan
        run: bun .github/scripts/store/plan.ts build "${{ inputs.app }}" "${{ inputs.channel }}" >> "$GITHUB_OUTPUT"

  app:
    needs: plan
    if: needs.plan.outputs.kind == 'app'
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: Lantharos/Sabine/.github/workflows/release-app.yml@537718548bbb66489fe00ae557fd52228a20248c
    with:
      sabine_version: ${{ needs.plan.outputs.sabine }}
      app: ${{ needs.plan.outputs.folder }}
      platforms: ${{ needs.plan.outputs.platforms }}
      version: ${{ needs.plan.outputs.version }}
      linux_packages: libglib2.0-dev libseccomp-dev
      # Building the MSI package accepts the WiX 7 licence: https://docs.firegiant.com/wix/osmf/
      accept_wix_eula: true
    secrets: inherit

  extension:
    needs: plan
    if: needs.plan.outputs.kind == 'extension'
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Install the helper's libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libglib2.0-dev libgstreamer1.0-dev libpipewire-0.3-dev zstd

      - name: Use the version being released
        run: sed -i 's/^version = ".*"$/version = "${{ needs.plan.outputs.version }}"/' "${{ needs.plan.outputs.folder }}/extension.toml"

      - run: extensions/pack.sh "${{ needs.plan.outputs.folder }}" dist

      - uses: actions/upload-artifact@v7
        with:
          name: extension-${{ matrix.runner }}
          path: dist
          if-no-files-found: error

  publish:
    needs: [plan, app, extension]
    if: ${{ !cancelled() && needs.plan.result == 'success' && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: actions/download-artifact@v8
        with:
          pattern: ${{ needs.plan.outputs.kind == 'app' && 'release-*' || 'extension-*' }}
          path: dist
          merge-multiple: true

      - id: notes
        if: inputs.channel != 'nightly'
        name: Take the release notes from the commit that set the version
        run: |
          manifest="${{ needs.plan.outputs.folder }}/${{ needs.plan.outputs.kind == 'app' && 'Sabine.toml' || 'extension.toml' }}"
          {
            echo "notes<<NOTES"
            git log -1 --format=%B -- "$manifest"
            echo "NOTES"
          } >> "$GITHUB_OUTPUT"

      - uses: Lantharos/Store/publish@v1
        with:
          files: dist/**
          schelf-toml: ${{ needs.plan.outputs.folder }}/schelf.toml
          version: ${{ needs.plan.outputs.version }}
          channel: ${{ inputs.channel }}
          notes: ${{ steps.notes.outputs.notes }}
